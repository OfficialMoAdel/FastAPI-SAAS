name: Performance Validation

# Isomorphism validation only.
#
# This workflow used to have five jobs. Four of them (phase-validation,
# full-validation, load-test, compare-baseline) drove scripts that no longer
# exist, and the two phase validators that remained could not pass: they read
# paths that were removed when `core/utils/cache.py` and `core/config.py`
# became packages. With no `continue-on-error` and no `|| true`, every push to
# main or develop that touched `src/app/**` failed here for a reason nobody
# could read, and the workflow only triggered on those branches — so from a
# feature branch the failure was invisible.
#
# The deleted validators were not worth repairing. Phase 1 asserted that
# `asyncio.gather()` on three local sleep functions finishes under 150ms — a
# test of the stdlib, not of this codebase. The rest read source files and
# substring-matched them, which is the source-text test pattern this repo has
# been actively retiring (see scripts/count_source_text_tests.py).
#
# `isomorphism_validator.py` is the one that earned its place: it exercises
# real behaviour and pins that an optimization did not change it. It is
# self-contained (stdlib + structlog), so it needs no database or Redis.
#
# Triggers cover every branch. A gate that only runs on main is not a gate.

on:
  push:
    paths:
      - 'src/app/**'
      - 'scripts/perf-validation/**'
      - '.github/workflows/perf-validation.yml'
  pull_request:
    paths:
      - 'src/app/**'
      - 'scripts/perf-validation/**'
      - '.github/workflows/perf-validation.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"

jobs:
  isomorphism-tests:
    name: Isomorphism Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pipx install uv

      - name: Install project
        run: uv sync

      - name: Run isomorphism tests
        # Run from the repository root: the validator locates the project by
        # walking up from its own path, and it imports only stdlib + structlog.
        #
        # The credentials below are NOT database credentials: nothing here
        # connects to Postgres or Redis. `test_c2_pixel_ua_differential`
        # imports the real `src.app.middleware.attack_detection`, whose
        # module-level `settings` construction requires `POSTGRES_USER` and
        # `POSTGRES_PASSWORD` to be present, `SECRET_KEY` to be >=32
        # characters, and `ADMIN_PASSWORD` to be present and to satisfy the
        # complexity validator (>=16 chars with lower, upper, digit and one
        # of [@$!%*?&]). Without them the import raises before the assertion
        # runs, so the test reports a config error instead of its result.
        # These are throwaway values for a process that only validates them.
        env:
          ENVIRONMENT: local
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          SECRET_KEY: "12345678901234567890123456789012"
          ADMIN_PASSWORD: "NotASecretCiFixture1!@#"
        run: uv run python scripts/perf-validation/isomorphism_validator.py

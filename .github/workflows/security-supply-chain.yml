name: Security Supply-Chain

on:
  push:
    branches: [feature, main]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly

jobs:
  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for secret detection
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pipx install uv
      - name: Audit locked dependencies
        run: |
          uv export --project src --format requirements-txt --no-hashes -o requirements.txt
          pipx install pip-audit
          pip-audit -r requirements.txt --strict

  import-linter:
    name: Architecture contract (import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv + dev dependencies
        # s92p.1: import-linter is declared in the dev dependency group, so
        # the ad-hoc 'uv pip install' is gone. CI now lints against the same
        # lockfile a developer gets locally, which is the point of declaring it.
        run: |
          pipx install uv
          cd src && uv sync --dev
      - name: Enforce layer contract (core must not import modules/api/middleware)
        # H-5: the committed .importlinter carries the contract with the 26
        # pre-existing violations explicitly ignore_imports-ed. CI now FAILS
        # on any NEW core->modules import — convention becomes a checked
        # invariant. The ignore list shrinks as the composition-root refactor
        # (app/events.py pattern) lands.
        working-directory: src
        run: uv run python -c "from importlinter.cli import lint_imports; raise SystemExit(lint_imports(no_logo=True))"
      - name: Report the source-text test count (b1xu.4)
        # A test that greps a source file and asserts a string matches passes
        # whether or not the code works, so the count is worth seeing on every
        # PR. The enforcing ratchet lived in tests/core/test_source_text_ratchet.py
        # and has been removed; this step reports the number so a regression is
        # visible in the log rather than left for the next audit to discover.
        run: uv run python scripts/count_source_text_tests.py
      - name: Reject Pydantic v1 shims in production code (io15.7)
        # pydantic>=2.6.1 makes parse_obj()/.dict() deprecated compatibility
        # shims, and the two spell the cache write path was mixing had
        # different unset-field semantics. No ruff rule covers this, so it is
        # a scan. The banned set is deliberately narrow: .copy() and .json()
        # are also dict/set/list and httpx/requests methods, and banning them
        # would fail on correct code.
        run: uv run python scripts/check_pydantic_v1_shims.py
      - name: Every boot gate has a boot-failure test (sj09.3)
        # A gate nobody has watched fail is a gate that might not be a gate.
        # This project has shipped two already: an import-linter that sat
        # inert, and a worker that ran on an import side effect instead of a
        # called gate. Prints the coverage count every run so the number is
        # visible per-PR rather than discovered by the next audit.
        run: uv run python scripts/check_boot_gate_coverage.py

  tracked-env-guard:
    name: Guard against tracked .env files (C-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the check sees every tracked path
      - name: Fail if any .env file (except *.example) is tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Tracked .env files must never reach the repo (C-1: secrets leaked into history before). Untrack them and purge history with git filter-repo."
            echo "$tracked"
            exit 1
          fi
          echo "No tracked .env files."

name: Backend CI

# Every push and PR runs the full check set. These triggers used to carry
# `paths-ignore: ['**/*.md', 'docs/**']`, which meant a change to a doc
# pointer or a CI gate alone never started this workflow — the checks were
# present in the file and unrunnable in practice. Dropping the filter is
# what makes the gates below mandatory rather than advisory.
#
# workflow_dispatch is here for ON-DEMAND arms only. The perf-harness job at
# the bottom of this file gates itself on `github.event_name ==
# 'workflow_dispatch'`, so push and PR runs skip it entirely and CI cost is
# unchanged; the dispatch trigger is what makes that arm launchable at all.
# Without it the perf-harness job would be permanently unreachable, which is
# how the previous `!` skipif-only arrangement in the harness left its Linux
# target unexecuted.
on:
  push:
  pull_request:
  workflow_dispatch:

# ONE workflow, and superseded runs do not keep billing.
#
# This block was absent, so a second push left the first run burning its full
# ~14 minutes alongside the new one: every job in it was real work whose result
# nobody would read, because the newer commit had already invalidated it.
# cancel-in-progress is what turns "two runs" into "one run".
#
# The group is deliberately SHARED with the other workflows by name. A GitHub
# concurrency group is repository-wide, so `ci-${{ github.ref }}` means a push
# here cancels an in-flight perf-validation run on the same ref too, rather than
# the two coexisting because they live in different files.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Folded in from the standalone "Performance Validation" workflow.
  #
  # Two workflows meant two checks to discover, two sets of annotations to read,
  # and two runs for one push. The validator is self-contained (stdlib +
  # structlog, no database and no Redis), so it costs ~30 s and has no reason to
  # be a separate workflow rather than a job.
  isomorphism:
    name: Isomorphism Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Install project
        run: uv sync

      - name: Run isomorphism tests
        # Run from the repository root: the validator locates the project by
        # walking up from its own path, and it imports only stdlib + structlog.
        #
        # The credentials below are NOT database credentials: nothing here
        # connects to Postgres or Redis. `test_c2_pixel_ua_differential` imports
        # the real `src.app.middleware.attack_detection`, whose module-level
        # `settings` construction requires POSTGRES_USER/POSTGRES_PASSWORD to be
        # present, SECRET_KEY to be >=32 characters, and ADMIN_PASSWORD to be
        # present and to satisfy the complexity validator. Without them the import
        # raises before the assertion runs, so the test reports a config error
        # instead of its result. These are throwaway values for a process that
        # only validates them.
        env:
          ENVIRONMENT: local
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          SECRET_KEY: "12345678901234567890123456789012"
          ADMIN_PASSWORD: "NotASecretCiFixture1!@#"
        run: uv run python scripts/perf-validation/isomorphism_validator.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Create venv
        run: uv venv

      - name: Install package with dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Run Ruff
        run: uv run ruff check src

      # s92p.7: the cross-module seam rule in ARCHITECTURE.md. Without a
      # step, the rule is prose; this is what makes it bind on a new
      # cross-module service import.
      - name: Run cross-module seam gate
        run: uv run python scripts/check_cross_module_seams.py

      # io15.8: a mutating endpoint with no response_model sends an
      # undocumented body, and a too-narrow one silently strips fields. The
      # gate reports the endpoints that genuinely cannot be annotated, with
      # the reason, so the exceptions stay reviewable.
      - name: Run mutation response model gate
        run: uv run python scripts/check_mutation_response_models.py

      # Every rooted `src/…`, `tests/…`, `scripts/…`, `docs/…` and `.github/…`
      # path in a document is a claim that the path exists, and the root
      # AGENTS.md states the gate is mandatory for that reason. Unconditional:
      # a `paths:` filter here would stop a documentation-only PR from
      # triggering this workflow, and the gate could no longer fire on the rot
      # it exists to catch. `tests/unit/scripts/test_doc_gate_wiring.py` fails
      # if a filter is ever reintroduced, or if this step is deleted.
      - name: Run doc path integrity gate
        run: uv run python scripts/check_doc_paths.py

      # sj09.6: a forked Alembic history fails at DEPLOY time
      # ("Multiple head revisions are present") and the app never boots.
      # Single-head and graph linearity are static properties of the
      # revision files, so they belong in the database-free lint job rather
      # than in the tests job.
      - name: Run migration graph gate
        run: uv run python scripts/check_migration_graph.py

      # sj09.6: the same class of rot in executable form. A script that
      # imports a module that no longer exists still passes every static
      # gate here; only importing it proves the operator-facing entry
      # points resolve.
      - name: Run operator script import gate
        run: uv run python scripts/check_script_imports.py

      # nrgi.7: a list service that changes its WHERE or ORDER BY keeps
      # working and silently loses the index that was the only reason the
      # query was cheap — a correct answer from a sequential scan is still a
      # correct answer, so no test catches it. The checker is pure AST: it
      # reads models.py and the declared predicates, so it needs no database
      # in the lint job.
      - name: Run index predicate coverage gate
        run: uv run python scripts/check_index_predicate_coverage.py

      # v8kz: Alembic compares indexes by NAME, and this repo declares no
      # naming_convention, so an index the ORM and the migration define
      # differently produces NO autogenerate diff. A migrated database and a
      # create_all database then hold different schemas. The gate compares
      # columns IN ORDER, the partial predicate and uniqueness — not just the
      # name, which is the whole point. Pure AST, no database.
      - name: Run index definition consistency gate
        run: uv run python scripts/check_index_definition_consistency.py

      # A column mapped on a model but never created by a migration is
      # invisible to every other gate here: create_all DERIVES the schema from
      # the ORM, so a create_all database always has it, and the tests run
      # against such a database. On a migrated database the query then raises
      # UndefinedColumnError. `pricing.currency` was exactly this, and adding
      # this gate immediately surfaced three more (passkey_credentials.aaguid
      # and .transports, magic_links.user_agent, user_sso_connections
      # .provider_email). Pure AST, no database.
      - name: Run schema parity gate
        run: uv run python scripts/check_schema_parity.py

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Create venv
        run: uv venv

      - name: Install package with dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Run mypy
        run: uv run mypy src --config-file pyproject.toml
        env:
          ENVIRONMENT: local
          SECRET_KEY: "12345678901234567890123456789012"

  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Create venv
        run: uv venv

      - name: Install package with dev dependencies
        run: uv pip install -e ".[dev]"

      # Real Alembic parity, against a genuinely migrated database.
      #
      # Runs in a SEPARATE database on purpose: `alembic upgrade head` here
      # would leave test_db with the migration-08 RLS policies enabled, whereas
      # the suite currently runs against a create_all schema that has none.
      # Flipping that is a much larger change than adding a gate, so this gets
      # its own database and test_db is left alone.
      #
      # NON-BLOCKING, deliberately. Measured on this repo at 7de0ff2a: ~395
      # diffs, of which ZERO are "added column" (the defect class that actually
      # breaks a migrated database). The rest are index naming, column
      # comments and TIMESTAMP type comparisons — long-standing, and exactly
      # the classes this repo deliberately gates with precise AST checks
      # instead (see check_index_definition_consistency.py: "Alembic compares
      # indexes by NAME, and this repo declares no naming_convention").
      #
      # As a BLOCKING gate this would be red on day one and stay red, which
      # trains people to ignore red. It runs so drift is VISIBLE and
      # reviewable in the job log; the blocking gate for missing columns is
      # `Run schema parity gate` in the lint job. Flip continue-on-error to
      # false only after the noise is reconciled.
      # Step-level env is NOT inherited from the service block or from the
      # "Run tests" step, so every step here declares what it needs.
      - name: Create parity check database
        run: |
          PGPASSWORD="${POSTGRES_PASSWORD}" psql -h localhost -U "${POSTGRES_USER}" -d postgres             -c "DROP DATABASE IF EXISTS parity_check;"             -c "CREATE DATABASE parity_check;"
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      # `src/migrations/env.py` imports `src.app.models`, which imports the
      # settings object, and `Settings` includes `FirstUserSettings`, whose
      # ADMIN_PASSWORD is a REQUIRED field. No migration step reads or uses
      # that password; the value only has to satisfy the field validator.
      - name: Apply migrations to parity check database
        run: uv run alembic -c src/alembic.ini upgrade head
        env:
          ENVIRONMENT: local
          SECRET_KEY: "12345678901234567890123456789012"
          # Throwaway CI fixture, NOT a real credential. Must satisfy
          # FirstUserSettings: >=16 chars with lower, upper, digit and one
          # of [@$!%*?&].
          ADMIN_PASSWORD: "NotASecretCiFixture1!@#"
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parity_check

      - name: Run alembic parity check (non-blocking, see comment above)
        continue-on-error: true
        run: uv run alembic -c src/alembic.ini check
        env:
          ENVIRONMENT: local
          SECRET_KEY: "12345678901234567890123456789012"
          ADMIN_PASSWORD: "NotASecretCiFixture1!@#"
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parity_check

      # `test_db` needs a schema BEFORE pytest, and it deliberately gets
      # `create_all` rather than `alembic upgrade head` — see the comment above
      # on the parity database for why the two must not share a database.
      #
      # Nothing was populating test_db: the main suite builds its own SQLite
      # file (tests/conftest.py), and the app's lifespan is NOT exercised by
      # tests that drive the ASGI app through `httpx.ASGITransport`
      # (tests/contract/conftest.py, tests/e2e/*) — that transport never runs
      # startup, so the `create_all` phase in the lifespan never fires either.
      # The code paths that DO talk to the app's real engine then hit an empty
      # database: `src/app/core/db/rls.py::_write_bypass_audit` imports
      # `async_engine` from `core.db.database` rather than using the caller's
      # session, so it raised UndefinedTableError on `rls_audit_log` (50
      # outcomes across contract + e2e).
      #
      # `create_all` is the shape those tests are written against and the shape
      # local dev gets from the same startup phase; migration 08 would instead
      # enable RLS policies on test_db and break every write that does not
      # first set a tenant context.
      #
      # This calls the app's own `create_tables()` — the same function the
      # lifespan calls — so CI and local dev cannot drift into using different
      # schema-creation paths. It needs SECRET_KEY/ADMIN_PASSWORD only because
      # importing settings constructs `FirstUserSettings`, whose ADMIN_PASSWORD
      # is required and validated; no migration step reads the value.
      - name: Create schema in test database
        run: uv run python -c "import asyncio; from src.app.core.setup import create_tables; asyncio.run(create_tables())"
        env:
          ENVIRONMENT: local
          SECRET_KEY: "12345678901234567890123456789012"
          # Throwaway CI fixture, NOT a real credential.
          ADMIN_PASSWORD: "NotASecretCiFixture1!@#"
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db

      - name: Run tests
        run: uv run pytest
        env:
          ENVIRONMENT: local
          SECRET_KEY: "12345678901234567890123456789012"

          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db

          REDIS_QUEUE_HOST: localhost
          REDIS_QUEUE_PORT: 6379
          REDIS_QUEUE_PASSWORD: ""

          REDIS_CACHE_HOST: localhost
          REDIS_CACHE_PORT: 6379
          REDIS_CACHE_PASSWORD: ""

          CRUD_ADMIN_REDIS_HOST: localhost
          CRUD_ADMIN_REDIS_PORT: 6379
          CRUD_ADMIN_REDIS_PASSWORD: ""
  perf-harness:
    # ON DEMAND ONLY. Runs the perf-harness refusal suite against a real
    # Linux host and reports what actually happened, rather than leaving the
    # Linux branch of the harness asserted only by a skipif.
    #
    # The gate is the whole design: push and PR runs must not pay for this,
    # so the job no-ops on every event except workflow_dispatch. Launch it with
    #   gh workflow run tests.yml --ref <branch>
    #
    # performance.yml was the obvious home for this and cannot be used: GitHub
    # only registers a workflow that exists on the DEFAULT branch, and
    # performance.yml is not on main (`gh workflow list` shows only Backend CI
    # and Semgrep; dispatching it returns HTTP 404 "not found on the default
    # branch"). tests.yml IS registered, which is what makes this arm
    # launchable without merging anything to main.
    #
    # That is also why this file is the only workflow that matters: the
    # validator previously lived in its own perf-validation.yml and has been
    # folded in above, so one push now costs one workflow run.
    #
    # Scope, stated plainly: this proves the harness runs on Linux and its
    # refusals behave. It does NOT produce a throughput/p95 measurement -- the
    # three-phase --emit-app-host-report path against a second host is still
    # open work in bead amxv, and a number from here must never be quoted as
    # a capacity result.
    name: perf harness + app host identity (on demand, shared runner)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # The app host is a real FastAPI server, so it needs a real Postgres and a
    # real Redis to boot against. This is NOT to measure load with: the load
    # path needs a second host (see the scope note at the foot of this job).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: perf_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # Job level so the app process, the report emitter and pytest all agree on
    # one topology. Nothing here is a real credential.
    env:
      ENVIRONMENT: local
      SECRET_KEY: "12345678901234567890123456789012"
      # Throwaway CI fixture, NOT a real credential. Required because the root
      # conftest imports settings, which constructs FirstUserSettings.
      ADMIN_PASSWORD: "NotASecretCiFixture1!@#"
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: perf_test_db
      REDIS_CACHE_HOST: localhost
      REDIS_CACHE_PORT: "6379"
      # The one deployment field no process can resolve about itself. Declared,
      # never inferred; the other five are read off this machine.
      PERF_ORCHESTRATOR: github-actions-shared-runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      # uv pip refuses to install without a target environment, so the venv
      # is created explicitly, exactly as the lint, type-check and tests jobs
      # above do. Omitting this step fails the install with
      # "No virtual environment found" and never reaches pytest.
      - name: Create venv
        run: uv venv

      - name: Install package with dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Create the app host schema
        # The app's own create_tables(), the same function its lifespan calls,
        # so CI and a local run cannot diverge. create_all and NOT alembic: the
        # suite is written against a create_all schema with no RLS policies,
        # and migration 08 would enable them.
        run: uv run python -c "import asyncio; from src.app.core.setup import create_tables; asyncio.run(create_tables())"

      - name: Start the app host the way the Dockerfile starts it
        # NO --loop and NO --http, because the Dockerfile CMD passes neither.
        # That omission IS the premise: uvicorn's auto-selection is what decides
        # uvloop vs asyncio and httptools vs h11, so passing either flag here
        # would make the identity assertion test something other than what
        # ships. 0.0.0.0 rather than 127.0.0.1 so the server is reachable.
        #
        # The venv's interpreter DIRECTLY, not `uv run uvicorn`. `uv run` puts
        # a wrapper around the very PID the evidence step later reads /proc for:
        # it may exec the interpreter or fork it, and `$!` names the server only
        # in the first case. When it forks, `$!` is uv's own PID and
        # /proc/$!/maps lists uv's Rust binary, which mentions neither extension
        # -- an empty result indistinguishable from "the server fell back to
        # asyncio". Same interpreter and same uvicorn either way; this just has no
        # process in between, and matches the Dockerfile CMD, which invokes the
        # venv's uvicorn directly.
        run: |
          mkdir -p reports
          nohup .venv/bin/python -m uvicorn src.app.main:app --host 0.0.0.0 --port 8000 \
            > reports/app_host_server.log 2>&1 &
          echo $! > reports/app_host_server.pid

      - name: Wait for the app host to answer its health endpoint
        run: |
          for _ in $(seq 1 60); do
            if [ "$(curl -s --noproxy '*' -m 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/health)" = "200" ]; then
              echo "app host is serving /api/v1/health"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the app host never answered /api/v1/health"
          cat reports/app_host_server.log
          exit 1

      - name: Emit the app host report on the app host
        # Step 1 of the two-host flow in scripts/run_perf_baseline.sh, and the
        # only step that needs no load host: it records what THIS machine would
        # resolve to, plus the deployment manifest of addendum 6.1.
        run: uv run python -m src.benchmarks.run_manifest --emit-app-host-report > reports/app_host_report.json

      - name: Record what the LIVE server process actually mapped
        # resolve_event_loop() documents its own limitation: it reports what
        # uvicorn's auto-selection RESOLVES TO, not what a running process
        # installed. /proc/<pid>/maps closes that gap from the other side --
        # uvloop and httptools are C extensions, so a server that really is on
        # them has their shared objects mapped, and one that silently fell back
        # to asyncio/h11 does not. Kept as an artefact, not just an assertion.
        run: |
          pid=$(cat reports/app_host_server.pid)
          # An empty file here is ambiguous on its face -- it reads as "the
          # server fell back to asyncio" whether or not that is true -- so say
          # what this PID actually is before concluding anything. Do not paper
          # over it and do not fail here: the gate two steps down fails loudly,
          # and this line makes the failure diagnosable from the log.
          if ! grep -Eqi 'uvloop|httptools' "/proc/${pid}/maps" 2>/dev/null; then
            echo "::warning::pid ${pid} maps neither extension; its cmdline is:"
            tr '\0' ' ' < "/proc/${pid}/cmdline" || echo "(pid ${pid} is gone)"
            echo ""
          fi
          grep -Ei 'uvloop|httptools' "/proc/${pid}/maps" | awk '{print $NF}' | sort -u > reports/app_host_mapped_extensions.txt
          echo "--- extensions mapped by the running server (pid ${pid}) ---"
          cat reports/app_host_mapped_extensions.txt

      - name: "L-14 (A-16/A-17) importtime on the Linux image + per-phase boot breakdown"
        # Two artefacts the addendum demands, both previously missing.
        #
        # (1) python -X importtime run HERE, on the Linux runner,
        #     against the same interpreter the server started with.
        #     F-4 recorded an 8.38 s import wall and 1 801 modules but
        #     NEVER ran the breakdown; addendum A-16 splits F-4 -- the
        #     seconds are [Unverified - Needs-Linux-measure] precisely
        #     because the breakdown was never taken on Linux, and
        #     UV_COMPILE_BYTECODE=1 (PF-5) changes import cost. The
        #     total here is the import wall only; it is NOT comparable
        #     to the lifespan boot figures below (import != boot) --
        #     F-4 error was conflating them. Cold only: importtime
        #     is a one-shot process.
        #
        # (2) The per-phase boot breakdown, from the timers
        #     src/app/core/runtime.py compose_phases ALREADY emits as
        #     startup_phase_completed (phase, duration_ms, boot_elapsed_ms).
        #     Both boots run SERIALLY IN ONE PROCESS: the web root phases
        #     (composition.py lifespan_factory) nest inside the admin
        #     root (lifespan_with_admin, main.py:23), so the log carries
        #     the web phases first, then the admin phases.
        #     Kept as artefacts under reports/ so a number is never
        #     quoted out of a step summary, and so the A-11 ADR item
        #     (gated on this bead by addendum A-17) can cite the file.
        run: |
          set -o pipefail
          echo "--- L-14 (1): python -X importtime on the Linux image ---"
          # Same interpreter the server started with (.venv/bin/python),
          # importing the app object exactly as the Dockerfile CMD uvicorn
          # would import it. -X importtime writes to stderr.
          .venv/bin/python -X importtime -c "import src.app.main" 2> reports/importtime.txt
          echo "importtime lines: $(wc -l < reports/importtime.txt)"
          echo "--- top 15 self-time import contributors ---"
          # Fields: import time: self [us] | cumulative | imported package.
          # Sorted into a file and THEN headed: `sort | head` under
          # `set -o pipefail` SIGPIPEs sort (exit 141) when head closes
          # the pipe after 15 lines, which fails the whole step.
          sort -t"|" -k2 -rn reports/importtime.txt > reports/importtime.sorted
          head -15 reports/importtime.sorted
          {
            echo "### L-14 importtime (Linux image, cold import only)"
            echo "import != boot: this is the import wall, not the lifespan boot below."
            echo "```"
            head -15 reports/importtime.sorted
            echo "```"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "--- L-14 (2): per-phase boot breakdown from compose_phases timers ---"
          grep -o "startup_phase_completed.*" reports/app_host_server.log > reports/boot_phases.raw || true
          if [ -s reports/boot_phases.raw ]; then
            echo "phases recorded: $(wc -l < reports/boot_phases.raw)"
            cat reports/boot_phases.raw
          else
            echo "no startup_phase_completed lines in the app host log; the"
            echo "per-phase breakdown is absent, not zero. Reported as absent"
            echo "rather than invented."
          fi

      - name: Upload L-14 boot artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-breakdown-${{ github.sha }}
          path: |
            reports/importtime.txt
            reports/boot_phases.raw
          retention-days: 30

      - name: "P-2/L-4 and P-10 mechanism probe on the Linux target"
        # 8rez and mrv3 cannot be closed on a Windows measurement host: uvloop is
        # not installable there (pyproject declares it under sys_platform !=
        # 'win32'), and the P-10 comparison needs a DEDICATED store because
        # INFO commandstats is instance-wide and counts other clients' traffic.
        # This job is ubuntu-latest with its own redis service container, so both
        # are satisfied here and only here.
        #
        # The probe REFUSES to produce a result off the production runtime rather
        # than emitting a laboratory figure that reads as a validation one.
        run: |
          set -o pipefail
          uv run python -m src.benchmarks.linux_mechanism_probe \
            --probe all \
            --seconds 30 \
            --redis-url "redis://localhost:6379/0" \
            --output reports/mechanism_probe.json
          echo "--- probe summary ---"
          uv run python - <<'PYEOF'
          import json
          from pathlib import Path
          probe = json.loads(Path("reports/mechanism_probe.json").read_text())
          for name, block in probe.items():
              if isinstance(block, dict) and block.get("failed"):
                  print(f"{name} FAILED: {block.get('error')}")
          mech = probe.get("mechanism", {})
          print("loop_module           :", mech.get("loop_module"))
          print("achieved_rate_hz      :", mech.get("achieved_rate_hz"))
          print("meets_minimum_rate    :", mech.get("meets_minimum_rate"))
          print("gc_pause_collections  :", (mech.get("gc_pause") or {}).get("gc_pause_collection_count"))
          print("gc_pause_total_ms     :", (mech.get("gc_pause") or {}).get("gc_pause_total_ms"))
          key = probe.get("apikey", {})
          if key and not key.get("failed"):
              print("apikey reads          :", key.get("reads"))
              print("apikey shim/server    :", key.get("shim_total_commands"), "/", key.get("info_commandstats_delta"))
              print("apikey commands/read  :", key.get("commands_per_read"))
              print("apikey rtt mean ms    :", key.get("rtt_mean_ms"))
              print("no-try/except premise :", (key.get("no_try_except_premise") or {}).get("holds"))
          red = probe.get("redis", {})
          print("shim commands         :", red.get("shim_total_commands"))
          print("info commandstats     :", red.get("info_commandstats_delta"))
          print("commands / round trips:", red.get("total_commands"), "/", red.get("total_round_trips"))
          print("shim absent on import :", not ((red.get("absent_unless_injected") or {}).get("installed_on_import", False)))
          PYEOF

      - name: Refuse a mechanism probe that reported a failure
        # The probe tolerates its own failure so its evidence survives; that makes
        # the step's exit code unreliable as a gate, so the recorded failure IS the
        # gate. A missing artefact fails too - a probe that wrote nothing has not
        # produced evidence, and letting that pass would report success for a run
        # that measured nothing.
        run: |
          test -s reports/mechanism_probe.json || {
            echo "::error::no mechanism probe artefact; the probe wrote nothing"
            exit 1
          }
          uv run python - <<'PYEOF'
          import json, sys
          from pathlib import Path
          probe = json.loads(Path("reports/mechanism_probe.json").read_text())
          failed = [n for n, b in probe.items() if isinstance(b, dict) and b.get("failed")]
          for name in failed:
              print(f"::error::{name} probe FAILED: {probe[name].get('error')}")
          if failed:
              sys.exit(1)
          mech, red = probe["mechanism"], probe["redis"]
          if mech.get("loop_module") != "uvloop":
              print(f"::error::probe ran on {mech.get('loop_module')!r}, not uvloop; "
                    f"addendum A-2 makes this NON-REPRESENTATIVE")
              sys.exit(1)
          if not mech.get("meets_minimum_rate"):
              print(f"::error::achieved {mech.get('achieved_rate_hz')} Hz, below the required 100 Hz")
              sys.exit(1)
          if not red.get("counts_agree"):
              print("::error::the two Redis counts did not agree")
              sys.exit(1)
          print("mechanism probe: uvloop at "
                f"{mech['achieved_rate_hz']} Hz; Redis counts agree "
                f"({red['shim_total_commands']} commands / {red['total_round_trips']} round trips)")
          PYEOF

      - name: Upload mechanism probe artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mechanism-probe-${{ github.sha }}
          path: reports/mechanism_probe.json
          retention-days: 30

      - name: "L-11 on-target read the Linux image installed CPython start-method source"
        # ADR-0016 Item 1 (A-11) read concurrent/futures/process.py and
        # multiprocessing/context.py from the WINDOWS host's installed
        # CPython 3.13.7 and concluded fork from the source branch -- sound,
        # but the addendum's method for L-11 is to read the installed
        # source IN THE TARGET IMAGE, and [Inference] may not be promoted
        # to [Confirmed] without that citation. This step does that read
        # HERE, on the Linux runner, so the citation names the file the
        # Linux target actually ships.
        run: |
          set -o pipefail
          ctx="$(python -c 'import multiprocessing, pathlib; print(pathlib.Path(multiprocessing.__file__).parent)')"
          fut="$(python -c 'import concurrent.futures, pathlib; print(pathlib.Path(concurrent.futures.__file__).parent)')"
          echo "--- Linux runner CPython: $(python --version) ---"
          echo "multiprocessing package: $ctx"
          echo "concurrent.futures package: $fut"
          echo '--- multiprocessing/context.py: the platform default ---'
          grep -n "_default_context" "$ctx/context.py" | head -6
          echo '--- concurrent/futures/process.py: the mp_context resolution ---'
          grep -n "max_tasks_per_child is not None" "$fut/process.py" | head -4
          {
            echo '### L-11 on-target: CPython start method, read on the Linux runner'
            echo "\`$(python --version)\`"
            echo '```'
            grep -n "_default_context" "$ctx/context.py" | head -6
            grep -n "max_tasks_per_child is not None" "$fut/process.py" | head -4
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The Linux default must be fork on the target: the else branch
          # of context.py is what A-8 lands on. Assert it is present.
          grep -q "_concrete_contexts\['fork'\]" "$ctx/context.py" \
            || { echo "::error::the Linux image's multiprocessing/context.py does not carry the fork default ADR-0016 cites"; exit 1; }
          echo "fork default present in the Linux image's installed CPython source"

      - name: Report which tests the platform gate would hide
        # The Linux target is asserted by skipif, so a skipped suite and a
        # passing one look identical in the summary line. Print the per-test
        # outcome with the skip reasons visible, because "the job was green"
        # must not be able to mean "nothing ran".
        run: |
          set -o pipefail
          uv run pytest tests/integration/performance/ -v -rs --color=no 2>&1 | tee harness-output.txt

      - name: Refuse to pass when the app host produced no evidence
        # The app-host identity tests SKIP when their input is absent, which is
        # correct on a developer machine and wrong here: this job exists to
        # produce that evidence. So the evidence is checked as a job output, not
        # only as a test outcome, and a skip can never be reported as success.
        #
        # The first check is the point of the whole arm, stated literally: the
        # job asserts one specific test id AND that it PASSED. A skipped suite
        # and a passing suite print the same summary line -- that
        # indistinguishability is what let this file carry an unexecuted Linux
        # target for so long -- so the id plus its outcome is the only thing
        # that separates the two from the outside.
        run: |
          test_id='TestTheAppHostIdentityIsReadOffARealLinuxServer::test_the_runtime_pair_is_the_production_one'
          grep -qE "$test_id PASSED" harness-output.txt || { echo "::error::the Linux-only identity test did not PASS -- it must EXECUTE, not skip"; exit 1; }
          test -s reports/app_host_report.json || { echo "::error::no app-host report was emitted"; exit 1; }
          test -s reports/app_host_mapped_extensions.txt || { echo "::error::the live server's mapped extensions were not recorded"; exit 1; }
          grep -q uvloop reports/app_host_mapped_extensions.txt || { echo "::error::the running server never mapped uvloop"; exit 1; }
          grep -q httptools reports/app_host_mapped_extensions.txt || { echo "::error::the running server never mapped httptools"; exit 1; }
          # The shared-runner label goes in the STEP SUMMARY, not only in the
          # job name, because the summary is what someone reads before quoting
          # a number out of this run -- and there is no number here to quote.
          {
            echo '### perf harness: SHARED RUNNER with co-located stores -- NOT a capacity result'
            echo ''
            echo '- app host bound in this job; Postgres and Redis are service containers on the same host'
            echo '- uvloop + httptools confirmed MAPPED BY THE RUNNING SERVER, not merely resolved'
            echo '- no p95 / throughput / RTT number is produced by this job'
            echo '- **this run satisfies NO Gate A checkbox**'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "app host identity evidence is present"

      - name: Upload harness output
        # Keeps the record as a file instead of a claim in a comment.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-harness-${{ github.sha }}
          path: |
            harness-output.txt
            reports/app_host_report.json
            reports/app_host_mapped_extensions.txt
            reports/app_host_server.log
          retention-days: 30

    # SCOPE, restated because this job now boots a real application and it would
    # be easy to over-read what that means.
    #
    # What this job ESTABLISHES: the five addendum-6.1 identity fields read off a
    # real Linux host, with uvloop and httptools confirmed in the RUNNING server
    # process rather than merely resolved. That is the L-1 evidence.
    #
    # What it does NOT establish, and what no single GitHub-hosted runner can:
    # a throughput or p95 number. run_perf_baseline.sh refuses to measure a
    # server on its own host -- loopback, this host's name, or ANY address bound
    # on this host -- and its header says why: "There is no configuration of this
    # script that measures a server on this host, which is the only way to make
    # the refusal below something other than a promise." Two hosts are a hard
    # precondition, so the three-phase load measurement (amxv AC b) needs a
    # self-hosted runner pair or real inter-host reachability. A number from
    # here must never be quoted as a capacity result.
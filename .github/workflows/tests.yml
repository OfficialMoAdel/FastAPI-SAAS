name: Backend CI

# Every push and PR runs the full check set. These triggers used to carry
# `paths-ignore: ['**/*.md', 'docs/**']`, which meant a change to a doc
# pointer or a CI gate alone never started this workflow — the checks were
# present in the file and unrunnable in practice. Dropping the filter is
# what makes the gates below mandatory rather than advisory.
#
# workflow_dispatch is here for ON-DEMAND arms only. The perf-harness job at
# the bottom of this file gates itself on `github.event_name ==
# 'workflow_dispatch'`, so push and PR runs skip it entirely and CI cost is
# unchanged; the dispatch trigger is what makes that arm launchable at all.
# Without it the perf-harness job would be permanently unreachable, which is
# how the previous `!` skipif-only arrangement in the harness left its Linux
# target unexecuted.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      arm:
        description: 'full = every job (default). perf-only = just the two-host perf arm, skipping lint/type-check/tests.'
        type: choice
        default: full
        options:
          - full
          - perf-only

# ONE workflow, and superseded runs do not keep billing.
#
# This block was absent, so a second push left the first run burning its full
# ~14 minutes alongside the new one: every job in it was real work whose result
# nobody would read, because the newer commit had already invalidated it.
# cancel-in-progress is what turns "two runs" into "one run".
#
# The group is deliberately SHARED with the other workflows by name. A GitHub
# concurrency group is repository-wide, so `ci-${{ github.ref }}` means a push
# here cancels an in-flight perf-validation run on the same ref too, rather than
# the two coexisting because they live in different files.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Folded in from the standalone "Performance Validation" workflow.
  #
  # Two workflows meant two checks to discover, two sets of annotations to read,
  # and two runs for one push. The validator is self-contained (stdlib +
  # structlog, no database and no Redis), so it costs ~30 s and has no reason to
  # be a separate workflow rather than a job.
  isomorphism:
    # Skipped by the perf-only dispatch arm: the two-host perf work does not
    # need them, and `tests` alone is ~14 minutes of paid runner time.
    if: github.event_name != 'workflow_dispatch' || inputs.arm != 'perf-only'
    name: Isomorphism Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Install project
        run: uv sync

      - name: Run isomorphism tests
        # Run from the repository root: the validator locates the project by
        # walking up from its own path, and it imports only stdlib + structlog.
        #
        # The credentials below are NOT database credentials: nothing here
        # connects to Postgres or Redis. `test_c2_pixel_ua_differential` imports
        # the real `src.app.middleware.attack_detection`, whose module-level
        # `settings` construction requires POSTGRES_USER/POSTGRES_PASSWORD to be
        # present, SECRET_KEY to be >=32 characters, and ADMIN_PASSWORD to be
        # present and to satisfy the complexity validator. Without them the import
        # raises before the assertion runs, so the test reports a config error
        # instead of its result. These are throwaway values for a process that
        # only validates them.
        env:
          ENVIRONMENT: local
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          SECRET_KEY: "12345678901234567890123456789012"
          ADMIN_PASSWORD: "NotASecretCiFixture1!@#"
        run: uv run python scripts/perf-validation/isomorphism_validator.py

  lint:
    # Skipped by the perf-only dispatch arm: the two-host perf work does not
    # need them, and `tests` alone is ~14 minutes of paid runner time.
    if: github.event_name != 'workflow_dispatch' || inputs.arm != 'perf-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Create venv
        run: uv venv

      - name: Install package with dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Run Ruff
        run: uv run ruff check src

      # s92p.7: the cross-module seam rule in ARCHITECTURE.md. Without a
      # step, the rule is prose; this is what makes it bind on a new
      # cross-module service import.
      - name: Run cross-module seam gate
        run: uv run python scripts/check_cross_module_seams.py

      # io15.8: a mutating endpoint with no response_model sends an
      # undocumented body, and a too-narrow one silently strips fields. The
      # gate reports the endpoints that genuinely cannot be annotated, with
      # the reason, so the exceptions stay reviewable.
      - name: Run mutation response model gate
        run: uv run python scripts/check_mutation_response_models.py

      # Every rooted `src/…`, `tests/…`, `scripts/…`, `docs/…` and `.github/…`
      # path in a document is a claim that the path exists, and the root
      # AGENTS.md states the gate is mandatory for that reason. Unconditional:
      # a `paths:` filter here would stop a documentation-only PR from
      # triggering this workflow, and the gate could no longer fire on the rot
      # it exists to catch. `tests/unit/scripts/test_doc_gate_wiring.py` fails
      # if a filter is ever reintroduced, or if this step is deleted.
      - name: Run doc path integrity gate
        run: uv run python scripts/check_doc_paths.py

      # sj09.6: a forked Alembic history fails at DEPLOY time
      # ("Multiple head revisions are present") and the app never boots.
      # Single-head and graph linearity are static properties of the
      # revision files, so they belong in the database-free lint job rather
      # than in the tests job.
      - name: Run migration graph gate
        run: uv run python scripts/check_migration_graph.py

      # sj09.6: the same class of rot in executable form. A script that
      # imports a module that no longer exists still passes every static
      # gate here; only importing it proves the operator-facing entry
      # points resolve.
      - name: Run operator script import gate
        run: uv run python scripts/check_script_imports.py

      # nrgi.7: a list service that changes its WHERE or ORDER BY keeps
      # working and silently loses the index that was the only reason the
      # query was cheap — a correct answer from a sequential scan is still a
      # correct answer, so no test catches it. The checker is pure AST: it
      # reads models.py and the declared predicates, so it needs no database
      # in the lint job.
      - name: Run index predicate coverage gate
        run: uv run python scripts/check_index_predicate_coverage.py

      # v8kz: Alembic compares indexes by NAME, and this repo declares no
      # naming_convention, so an index the ORM and the migration define
      # differently produces NO autogenerate diff. A migrated database and a
      # create_all database then hold different schemas. The gate compares
      # columns IN ORDER, the partial predicate and uniqueness — not just the
      # name, which is the whole point. Pure AST, no database.
      - name: Run index definition consistency gate
        run: uv run python scripts/check_index_definition_consistency.py

      # A column mapped on a model but never created by a migration is
      # invisible to every other gate here: create_all DERIVES the schema from
      # the ORM, so a create_all database always has it, and the tests run
      # against such a database. On a migrated database the query then raises
      # UndefinedColumnError. `pricing.currency` was exactly this, and adding
      # this gate immediately surfaced three more (passkey_credentials.aaguid
      # and .transports, magic_links.user_agent, user_sso_connections
      # .provider_email). Pure AST, no database.
      - name: Run schema parity gate
        run: uv run python scripts/check_schema_parity.py

  type-check:
    # Skipped by the perf-only dispatch arm: the two-host perf work does not
    # need them, and `tests` alone is ~14 minutes of paid runner time.
    if: github.event_name != 'workflow_dispatch' || inputs.arm != 'perf-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Create venv
        run: uv venv

      - name: Install package with dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Run mypy
        run: uv run mypy src --config-file pyproject.toml
        env:
          ENVIRONMENT: local
          SECRET_KEY: "12345678901234567890123456789012"

  tests:
    # Skipped by the perf-only dispatch arm: the two-host perf work does not
    # need them, and `tests` alone is ~14 minutes of paid runner time.
    if: github.event_name != 'workflow_dispatch' || inputs.arm != 'perf-only'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Create venv
        run: uv venv

      - name: Install package with dev dependencies
        run: uv pip install -e ".[dev]"

      # Real Alembic parity, against a genuinely migrated database.
      #
      # Runs in a SEPARATE database on purpose: `alembic upgrade head` here
      # would leave test_db with the migration-08 RLS policies enabled, whereas
      # the suite currently runs against a create_all schema that has none.
      # Flipping that is a much larger change than adding a gate, so this gets
      # its own database and test_db is left alone.
      #
      # NON-BLOCKING, deliberately. Measured on this repo at 7de0ff2a: ~395
      # diffs, of which ZERO are "added column" (the defect class that actually
      # breaks a migrated database). The rest are index naming, column
      # comments and TIMESTAMP type comparisons — long-standing, and exactly
      # the classes this repo deliberately gates with precise AST checks
      # instead (see check_index_definition_consistency.py: "Alembic compares
      # indexes by NAME, and this repo declares no naming_convention").
      #
      # As a BLOCKING gate this would be red on day one and stay red, which
      # trains people to ignore red. It runs so drift is VISIBLE and
      # reviewable in the job log; the blocking gate for missing columns is
      # `Run schema parity gate` in the lint job. Flip continue-on-error to
      # false only after the noise is reconciled.
      # Step-level env is NOT inherited from the service block or from the
      # "Run tests" step, so every step here declares what it needs.
      - name: Create parity check database
        run: |
          PGPASSWORD="${POSTGRES_PASSWORD}" psql -h localhost -U "${POSTGRES_USER}" -d postgres             -c "DROP DATABASE IF EXISTS parity_check;"             -c "CREATE DATABASE parity_check;"
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      # `src/migrations/env.py` imports `src.app.models`, which imports the
      # settings object, and `Settings` includes `FirstUserSettings`, whose
      # ADMIN_PASSWORD is a REQUIRED field. No migration step reads or uses
      # that password; the value only has to satisfy the field validator.
      - name: Apply migrations to parity check database
        run: uv run alembic -c src/alembic.ini upgrade head
        env:
          ENVIRONMENT: local
          SECRET_KEY: "12345678901234567890123456789012"
          # Throwaway CI fixture, NOT a real credential. Must satisfy
          # FirstUserSettings: >=16 chars with lower, upper, digit and one
          # of [@$!%*?&].
          ADMIN_PASSWORD: "NotASecretCiFixture1!@#"
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parity_check

      - name: Run alembic parity check (non-blocking, see comment above)
        continue-on-error: true
        run: uv run alembic -c src/alembic.ini check
        env:
          ENVIRONMENT: local
          SECRET_KEY: "12345678901234567890123456789012"
          ADMIN_PASSWORD: "NotASecretCiFixture1!@#"
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parity_check

      # `test_db` needs a schema BEFORE pytest, and it deliberately gets
      # `create_all` rather than `alembic upgrade head` — see the comment above
      # on the parity database for why the two must not share a database.
      #
      # Nothing was populating test_db: the main suite builds its own SQLite
      # file (tests/conftest.py), and the app's lifespan is NOT exercised by
      # tests that drive the ASGI app through `httpx.ASGITransport`
      # (tests/contract/conftest.py, tests/e2e/*) — that transport never runs
      # startup, so the `create_all` phase in the lifespan never fires either.
      # The code paths that DO talk to the app's real engine then hit an empty
      # database: `src/app/core/db/rls.py::_write_bypass_audit` imports
      # `async_engine` from `core.db.database` rather than using the caller's
      # session, so it raised UndefinedTableError on `rls_audit_log` (50
      # outcomes across contract + e2e).
      #
      # `create_all` is the shape those tests are written against and the shape
      # local dev gets from the same startup phase; migration 08 would instead
      # enable RLS policies on test_db and break every write that does not
      # first set a tenant context.
      #
      # This calls the app's own `create_tables()` — the same function the
      # lifespan calls — so CI and local dev cannot drift into using different
      # schema-creation paths. It needs SECRET_KEY/ADMIN_PASSWORD only because
      # importing settings constructs `FirstUserSettings`, whose ADMIN_PASSWORD
      # is required and validated; no migration step reads the value.
      - name: Create schema in test database
        run: uv run python -c "import asyncio; from src.app.core.setup import create_tables; asyncio.run(create_tables())"
        env:
          ENVIRONMENT: local
          SECRET_KEY: "12345678901234567890123456789012"
          # Throwaway CI fixture, NOT a real credential.
          ADMIN_PASSWORD: "NotASecretCiFixture1!@#"
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db

      - name: Run tests
        run: uv run pytest
        env:
          ENVIRONMENT: local
          SECRET_KEY: "12345678901234567890123456789012"

          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db

          REDIS_QUEUE_HOST: localhost
          REDIS_QUEUE_PORT: 6379
          REDIS_QUEUE_PASSWORD: ""

          REDIS_CACHE_HOST: localhost
          REDIS_CACHE_PORT: 6379
          REDIS_CACHE_PASSWORD: ""

          CRUD_ADMIN_REDIS_HOST: localhost
          CRUD_ADMIN_REDIS_PORT: 6379
          CRUD_ADMIN_REDIS_PASSWORD: ""
  # ---------------------------------------------------------------------------
  # TWO-HOST PERF ARM. Dispatch-only, and the only part of CI that may quote a
  # throughput or p95 number.
  #
  # Why two jobs and not one: a GitHub job is assigned ONE runner, so a job
  # cannot both generate load and be the server it loads. The app host runs on
  # `perf-app`, the load generator on `perf-load`, and the second job targets the
  # first host's PRIVATE address.
  #
  # WHY THE PRIVATE ADDRESS (192.168.121.4) AND NOT THE PUBLIC ONE (40.123.236.144)
  # -- this is the load-bearing choice in the whole file. Both VMs also have a
  # public address, and targeting that would measure the internet: hundreds of
  # milliseconds of transit between two machines in the same datacentre. The RTT
  # is the quantity every Redis round-trip finding rests on, and it must reflect
  # the LAN the deployment actually uses - the same regime as the stores at
  # 192.168.121.147. A public-address number would be real, reproducible, and
  # meaningless, which is the same class of defect as the co-located Windows runs
  # this whole programme exists to undo.
  #
  # The same-host refusal in run_perf_baseline.sh is NOT weakened and NOT
  # worked around. `perf-preflight` below proves the two runners really are
  # different machines before any load is generated, so the refusal is satisfied
  # honestly rather than bypassed.
  # ---------------------------------------------------------------------------

  perf-app-host:
    name: perf app host (perf-app)
    runs-on: [self-hosted, linux, perf-app]
    if: github.event_name == 'workflow_dispatch'
    # packages: write is needed to push the measured image to GHCR, which is
    # what gives PERF_IMAGE_DIGEST a REAL OCI registry digest. Without a
    # registry the field can only ever be a local image ID, which is a
    # different hash over different bytes - and declaring one as the other is
    # exactly the provenance lie the deployment gate exists to refuse.
    permissions:
      contents: read
      packages: write
    outputs:
      host: ${{ steps.address.outputs.ip }}
    env:
      ENVIRONMENT: local
      SECRET_KEY: "12345678901234567890123456789012"
      ADMIN_PASSWORD: "NotASecretCiFixture1!@#"
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: perf_test_db
      REDIS_CACHE_HOST: localhost
      REDIS_CACHE_PORT: "6379"
      REDIS_QUEUE_HOST: localhost
      REDIS_QUEUE_PORT: "6379"
      CRUD_ADMIN_REDIS_HOST: localhost
      CRUD_ADMIN_REDIS_PORT: "6379"
      # The one deployment field no process can resolve about itself.
      PERF_ORCHESTRATOR: self-hosted-perf-app
      # ALSO unresolvable from inside: the store addresses are compose SERVICE
      # NAMES ("db:5432", "redis:6379"), and resolve_store_locality returns None
      # for a bare hostname rather than guessing. It is declared here because it
      # is a fact about the topology this job creates: `docker compose up db
      # redis web` puts all three on ONE host, so the stores are co-located with
      # the app. That is the value Phase 0's RTT regime is read against, and
      # getting it wrong would make every round-trip figure an order of
      # magnitude less relevant than assumed.
      PERF_STORE_LOCALITY: co-located

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Report this host's address
        # Handed to the load job. Private address, because that is what a peer on
        # the same network reaches it at.
        id: address
        run: |
          set -euo pipefail
          ip="$(hostname -I | awk '{print $1}')"
          echo "ip=${ip}" >> "$GITHUB_OUTPUT"
          echo "app host private address: ${ip}"
          echo "hostnames: $(hostname -s) / $(hostname -f 2>/dev/null || echo none)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Create venv
        run: uv venv

      - name: Install package with dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Build and publish the measured image, pinned by digest
        # WHY PUSH AT ALL
        # --------------
        # The deployment manifest requires an `image_digest`, and the harness
        # refuses the run without it (EXIT_DEPLOYMENT_UNDECLARED = 10). That
        # field wants an OCI REGISTRY digest - sha256 over the manifest - which
        # only exists once the image has been pushed somewhere that computes one.
        #
        # A locally built compose image has an IMAGE ID, which is a different
        # hash over different bytes (config + layers, not the manifest). It even
        # matches the pattern the loader accepts. Passing it would therefore be
        # undetectable and wrong - a provenance lie in the one field whose whole
        # purpose is to say what was measured. So the image is really published.
        #
        # Once pushed, the compose override pins web to that exact digest, so the
        # container that serves the load is provably the one that was built here,
        # and the number is reproducible by anyone pulling the same digest.
        id: image
        env:
          REGISTRY: ghcr.io
          # github.repository preserves the owner's capitalisation
          # ("OfficialMoAdel/FastAPI-SAAS"); GHCR requires the path to be
          # lowercase, so it is lowered here rather than at every use site.
          IMAGE_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          image_lower="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" \
            -u "${{ github.actor }}" --password-stdin
          image="${REGISTRY}/${image_lower}:perf"
          docker build -t "${image}" -f Dockerfile .
          docker push "${image}"
          # The digest, as the registry reports it - not the tag, and not the
          # local image ID.
          digest="$(docker image inspect "${image}" \
            --format '{{index .RepoDigests 0}}' | sed 's/.*@//')"
          if [ -z "${digest}" ] || [ "${digest}" = "<no value>" ]; then
            echo "::error::the pushed image reported no repo digest; provenance cannot be established"
            exit 1
          fi
          echo "pinned=${image}@${digest}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published and pinned: ${image}@${digest}"

      - name: Create .env for Docker Compose
        # src/.env is GITIGNORED (.gitignore:147), so it is absent from every
        # checkout - including this one. docker-compose.yml declares
        # env_file: ./src/.env for db and web, so without this file `compose up`
        # fails or starts a stack with no configuration at all.
        #
        # Hosts are SERVICE NAMES, not localhost: the web container reaches its
        # peers by compose DNS, and `localhost` inside that container is the
        # container itself. That is the difference between a working stack and a
        # web container that cannot find its database.
        env:
          # STEP level, not job level: a job-level env cannot reference
          # steps.* - it is evaluated before any step has run, and the workflow
          # fails to parse with "Unrecognized named-value: 'steps'". The digest
          # only exists after the publish step, so it is threaded through here.
          PERF_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p src
          cat > src/.env <<EOF
          ENVIRONMENT=local
          SECRET_KEY=${SECRET_KEY}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          POSTGRES_SERVER=db
          POSTGRES_PORT=5432
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          REDIS_CACHE_HOST=redis
          REDIS_CACHE_PORT=6379
          REDIS_QUEUE_HOST=redis
          REDIS_QUEUE_PORT=6379
          CRUD_ADMIN_REDIS_HOST=redis
          CRUD_ADMIN_REDIS_PORT=6379
          PERF_ORCHESTRATOR=${PERF_ORCHESTRATOR}
          PERF_STORE_LOCALITY=${PERF_STORE_LOCALITY}
          PERF_IMAGE_DIGEST=${PERF_IMAGE_DIGEST}
          EOF
          echo "wrote src/.env for compose"

      - name: Start services with Docker Compose
        # WHY COMPOSE AND NOT THE `services:` BLOCK
        # -----------------------------------------
        # A GitHub `services:` container is tied to the JOB that declared it:
        # when the job ends, GitHub destroys it. The previous shape therefore
        # could not work - the app host job finished, its Postgres and Redis were
        # torn down with it, uvicorn died with them, and the load job that ran
        # next found nothing listening on 192.168.121.4:8000. The symptom was a
        # "cannot reach the app host" that looked exactly like a firewall, and it
        # was not one. Compose containers are ordinary containers and outlive the
        # job that started them, which is the property the two-host design needs.
        #
        # THE OVERRIDE IS NOT OPTIONAL
        # ---------------------------
        # docker-compose.yml's `web` service does NOT reproduce the runtime that
        # ships, and using it unmodified would produce a green run measuring the
        # wrong thing:
        #   * its command is `uvicorn app.main:app ... --reload`, but the
        #     Dockerfile's CMD is `uvicorn src.app.main:app` with no --reload.
        #     Different import path, and --reload adds a supervising process that
        #     is not what production runs.
        #   * it mounts ./src/app over /code/app, but the image puts the code at
        #     /code/src (WORKDIR /code, PYTHONPATH=/code). The mount creates an
        #     empty /code/app and shadows nothing that matters.
        # The override restores the Dockerfile's CMD and drops the bogus mount, so
        # what runs here is what runs in production.
        run: |
          set -euo pipefail
          # web runs the PUBLISHED image BY DIGEST, not a local build.
          #
          # `build:` is dropped so compose pulls what the publish step pushed, and
          # `image:` is the digest reference rather than the tag - a tag can be
          # moved, a digest cannot. So the container serving the load is provably
          # the image that was just built, and reproducible by pulling the same
          # digest.
          cat > docker-compose.perf.yml <<YAML
          services:
            web:
              image: ${{ steps.image.outputs.pinned }}
              build: null
              command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000
              volumes: []
              restart: unless-stopped
          YAML

          echo "=== compose override ==="; cat docker-compose.perf.yml

          # Clean up any previous run's leftovers before starting.
          docker compose -f docker-compose.yml -f docker-compose.perf.yml \
            down --remove-orphans 2>/dev/null || true

          # STORES FIRST, THEN SCHEMA, THEN WEB - in that order, deliberately.
          #
          # The app's startup opens an RLS bypass, which requires the
          # rls_audit_log table to exist already:
          #
          #   RLSAuditFailureError: RLS bypass aborted due to audit log failure:
          #   UndefinedTableError: relation "rls_audit_log" does not exist
          #   ERROR: Application startup failed. Exiting.
          #
          # Starting web before the schema exists puts it straight into a crash
          # loop, and `compose exec` into a crash-looping container is unreliable.
          # So the schema is created by a ONE-OFF container (`run --rm`), which
          # needs nothing but the stores to be up.
          #
          # `worker` is excluded deliberately: a background worker competes for
          # CPU with the app under measurement, which is the same contention the
          # two-host split exists to exclude.
          echo "=== 1/3 stores (db, redis) ==="
          docker compose -f docker-compose.yml -f docker-compose.perf.yml \
            up -d --build db redis
          # WAIT FOR POSTGRES, do not ask once. `compose up -d` returns as soon
          # as the container is STARTED, not ready, and postgres needs a moment to
          # initialise a fresh volume. A single check failed here with
          # "/var/run/postgresql:5432 - no response" and exit 2 - which reads like
          # a database problem and is a race.
          for _ in $(seq 1 60); do
            if docker compose -f docker-compose.yml -f docker-compose.perf.yml \
                 exec -T db pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" \
                 > /dev/null 2>&1; then
              echo "postgres is accepting connections"
              break
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.perf.yml \
            exec -T db pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"

          echo "=== 2/3 schema, via a one-off container ==="
          # The app's OWN create_tables(), the same function its lifespan calls,
          # run INSIDE the web image so it sees the same src/.env - whose
          # POSTGRES_SERVER is the compose service name `db`, not localhost.
          docker compose -f docker-compose.yml -f docker-compose.perf.yml \
            run --rm -T --entrypoint python web \
            -c "import asyncio; from src.app.core.setup import create_tables; asyncio.run(create_tables())"

          echo "=== 3/3 the app ==="
          docker compose -f docker-compose.yml -f docker-compose.perf.yml \
            up -d --build web

          echo "=== Running containers ==="
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "=== Waiting for services to be ready ==="
          sleep 15

      - name: Wait for the app host to answer its health endpoint
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if [ "$(curl -s --noproxy '*' -m 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/health)" = "200" ]; then
              echo "app host is serving /api/v1/health"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the app host never answered /api/v1/health"
          echo "=== Docker compose logs (web) ==="
          docker compose -f docker-compose.yml -f docker-compose.perf.yml logs --tail=50 web
          echo "=== Docker compose logs (db) ==="
          docker compose -f docker-compose.yml -f docker-compose.perf.yml logs --tail=20 db
          echo "=== Docker compose logs (redis) ==="
          docker compose -f docker-compose.yml -f docker-compose.perf.yml logs --tail=20 redis
          exit 1

      - name: Emit the app host report from INSIDE the app container
        # INSIDE the container, not on the host.
        #
        # The app host report describes the RUNTIME - which event loop uvicorn's
        # auto-selection resolved, which HTTP implementation it bound. With the app
        # in a container, the host is a different machine's environment and would
        # report the HOST's resolution, which is the drift T-8 exists to prevent.
        # The report is only meaningful when it comes from the process it describes.
        #
        # compose exec is the same process namespace, so this is the app's view.
        run: |
          set -euo pipefail
          mkdir -p reports
          docker compose -f docker-compose.yml -f docker-compose.perf.yml \
            exec -T web python -m src.benchmarks.run_manifest --emit-app-host-report \
            > reports/app_host_report.json
          echo "--- app host report ---"; cat reports/app_host_report.json

      - name: Record what the LIVE server process actually mapped
        # The inner script is written to a FILE and then run, rather than passed
        # as `sh -c '...'`.
        #
        # The inline form could not survive its own quoting: the script contains a
        # single quote in `tr "\0" " "`, which terminated the OUTER runner
        # single-quoted string, so the inner shell received a truncated script
        # ending in an unterminated "$(tr" and died with
        # "Syntax error: end of file unexpected". A file has no such problem.
        #
        # NON-BLOCKING (continue-on-error below): the authoritative runtime
        # evidence is the app host report, which records event_loop=uvloop and
        # http=httptools from inside the container. This proves the stronger
        # claim - that the RUNNING process has those extensions mapped - and is
        # not worth blocking the whole arm over, since its failure mode here is a
        # quoting bug and says nothing about the runtime.
        continue-on-error: true
        run: |
          set -uo pipefail
          cat > /tmp/maps.sh <<'INNER'
          # /proc scanned in shell, NOT pgrep: the image is slim and has no
          # procps, so pgrep is absent - and its absence reports itself as "no
          # uvicorn process found", which reads as a dead server.
          pid=""
          for d in /proc/[0-9]*; do
            if grep -qa uvicorn "$d/cmdline" 2>/dev/null; then
              pid="${d#/proc/}"
              break
            fi
          done
          if [ -z "$pid" ]; then
            echo "no uvicorn process found inside the container" >&2
            for p in $(ls /proc | grep -E '^[0-9]+$'); do
              echo "  pid $p: $(tr '\0' ' ' < /proc/$p/cmdline 2>/dev/null | cut -c1-90)"
            done
            exit 1
          fi
          echo "uvicorn pid inside the container: $pid"
          if ! grep -Eqi "uvloop|httptools" "/proc/$pid/maps"; then
            echo "::warning::pid $pid maps neither extension; its cmdline is:"
            tr '\0' ' ' < "/proc/$pid/cmdline" || echo "(pid $pid is gone)"
          fi
          grep -Ei "uvloop|httptools" "/proc/$pid/maps" | awk '{print $NF}' | sort -u
          INNER
          mkdir -p reports
          docker compose -f docker-compose.yml -f docker-compose.perf.yml \
            cp /dev/null /tmp/maps.sh 2>/dev/null || true
          docker cp /tmp/maps.sh "$(docker compose -f docker-compose.yml -f docker-compose.perf.yml ps -q web)":/tmp/maps.sh
          docker compose -f docker-compose.yml -f docker-compose.perf.yml \
            exec -T web sh /tmp/maps.sh > reports/.maps.tmp 2>&1 || true
          if grep -qE "uvloop|httptools" reports/.maps.tmp 2>/dev/null; then
            grep -E "uvloop|httptools" reports/.maps.tmp | sort -u > reports/app_host_mapped_extensions.txt
            echo "--- extensions mapped by the running server ---"
            cat reports/app_host_mapped_extensions.txt
          else
            echo "note: the /proc/maps confirmation did not run; see reports/.maps detail in the log"
            sed -n '1,20p' reports/.maps.tmp
            : > reports/app_host_mapped_extensions.txt
          fi
          rm -f reports/.maps.tmp

      - name: Run the mechanism probe from INSIDE the app container
        # L-14, L-11, L-16, P-2/L-4, P-10 - all measured where the app actually
        # runs.
        #
        # INSIDE, and at redis://redis:6379/0 rather than localhost:
        #   * loop lag and GC pauses are properties of the process running the
        #     app. Sampling the HOST's loop measures a host that is not serving
        #     anything, which would make the "mechanism behind the 39x p95"
        #     claim a statement about the wrong loop.
        #   * redis is `expose`d, not published, so it has no host port at all -
        #     from the host it is simply not reachable. Inside the compose
        #     network the service name resolves.
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.perf.yml \
            exec -T web python -m src.benchmarks.linux_mechanism_probe \
              --probe all \
              --seconds 30 \
              --redis-url "redis://redis:6379/0" \
              --output /tmp/mechanism_probe.json
          docker compose -f docker-compose.yml -f docker-compose.perf.yml \
            exec -T web cat /tmp/mechanism_probe.json
          docker compose -f docker-compose.yml -f docker-compose.perf.yml \
            exec -T web python -c "
          import json
          from pathlib import Path
          probe = json.loads(Path('/tmp/mechanism_probe.json').read_text())
          for name, block in probe.items():
              if isinstance(block, dict) and block.get('failed'):
                  print(f'::error::{name} probe FAILED: {block.get("error")}')
          mech = probe.get('mechanism', {})
          print('loop_module        :', mech.get('loop_module'))
          print('achieved_rate_hz   :', mech.get('achieved_rate_hz'))
          print('meets_minimum_rate :', mech.get('meets_minimum_rate'))
          red = probe.get('redis', {})
          print('redis shim/server  :', red.get('shim_total_commands'), '/', red.get('info_commandstats_delta'))
          key = probe.get('apikey', {})
          print('apikey cmds/read   :', key.get('commands_per_read'), 'rtt ms:', key.get('rtt_mean_ms'))
          "

      - name: Assert the app host runs the PRODUCTION runtime
        # The gate that replaces the /proc/maps check as a blocker.
        #
        # A run on asyncio or h11 is a DIFFERENT INSTRUMENT, not a faster or
        # slower version of this one, and nothing else in the arm would notice -
        # the load numbers would simply be about a different runtime. So the
        # report is asserted, not merely recorded.
        run: |
          set -euo pipefail
          uv run python - <<'PYEOF'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/app_host_report.json").read_text())
          host = report.get("app_host", report)
          loop = host.get("event_loop")
          http = host.get("http")
          print("event_loop:", loop, "| http:", http)
          problems = []
          if loop != "uvloop":
              problems.append(f"event loop is {loop!r}, not 'uvloop'")
          if http != "httptools":
              problems.append(f"http implementation is {http!r}, not 'httptools'")
          if problems:
              raise SystemExit(
                  "::error::the app host is not on the production runtime: "
                  + "; ".join(problems)
                  + ". This run is NON-REPRESENTATIVE and every number from it is "
                  "about a different instrument."
              )
          print("production runtime confirmed: uvloop + httptools")
          PYEOF

      - name: Record which runtime evidence this run carries
        # Never let a reader assume the stronger evidence exists when it did not.
        run: |
          set -uo pipefail
          if grep -qE 'uvloop|httptools' reports/app_host_mapped_extensions.txt 2>/dev/null; then
            echo "runtime evidence: REPORT (asserted uvloop+httptools) + /proc/maps (running process)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "runtime evidence: REPORT only (asserted uvloop+httptools); the /proc/maps confirmation did not run" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Copy the probe artefact out of the app container
        # NON-BLOCKING. This step only concerns mechanism_probe.json.
        # app_host_report.json - the file the LOAD job actually needs - is
        # produced on this host and uploaded from here regardless of what this
        # step does, so a failure here cannot stop the measurement.
        continue-on-error: true
        # Only the PROBE needs copying: app_host_report.json was produced by
        # redirecting stdout on the HOST, so it is already in reports/ here.
        #
        # The previous version looped over both files and ran `cat reports/$f`
        # INSIDE the container. That path does not exist there, so cat failed -
        # and because the redirect `> reports/$f` is evaluated by the host shell
        # FIRST, it truncated the perfectly good host-side report to zero bytes
        # before cat ran. The artefact then uploaded an empty report and the load
        # job refused it.
        #
        # `cat` to a temp name and move only on success, so a failed copy can
        # never destroy what is already there.
        run: |
          set -uo pipefail
          mkdir -p reports
          docker compose -f docker-compose.yml -f docker-compose.perf.yml \\
            exec -T web cat /tmp/mechanism_probe.json > reports/.probe.tmp 2>/dev/null || true
          if [ -s reports/.probe.tmp ]; then
            mv reports/.probe.tmp reports/mechanism_probe.json
            echo "copied mechanism_probe.json out of the container"
          else
            rm -f reports/.probe.tmp
            echo "note: the probe did not produce /tmp/mechanism_probe.json in the container"
          fi
          ls -la reports/
          docker compose -f docker-compose.yml -f docker-compose.perf.yml \\
            logs --tail=80 web > reports/app_host_server.log 2>&1 || true

      - name: Refuse to upload a corrupted app host report
        # THE PRODUCER CHECKS ITS OWN OUTPUT BEFORE UPLOADING IT.
        #
        # A redirect on this host once truncated app_host_report.json to zero
        # bytes. The job still went GREEN: `Upload` carries `if: always()` and
        # `if-no-files-found: warn`, so uploading a corrupt artefact succeeds. The
        # corruption surfaced only in the consumer - a different runner, a
        # different job - where it failed as:
        #
        #   no app_host_report.json was carried from the app host
        #
        # which names a transport problem that did not exist, and points away
        # from the one that did. The failure was only diagnosable by opening the
        # artefact and finding app_host_report.json at 0 bytes.
        #
        # So: refuse here. A run that cannot hand over a usable report must fail
        # on the job that produced it, where the cause is visible, rather than
        # on the job that needed it, where it is not.
        run: |
          set -uo pipefail
          # The two files are NOT equally important, and treating them alike is
          # how a nice-to-have starts blocking a deliverable:
          #
          #   app_host_report.json  - CONSUMED by perf-load. run_perf_baseline.sh
          #                             refuses to run without it (exit 6). A
          #                             corrupt one stops the measurement, so it
          #                             must stop the PRODUCER too.
          #   mechanism_probe.json  - evidence only. Nothing consumes it in this
          #                             arm; its absence is recorded, not fatal.
          if [ ! -s reports/app_host_report.json ]; then
            size=$( [ -f reports/app_host_report.json ] && wc -c < reports/app_host_report.json | tr -d ' ' || echo "absent" )
            echo "::error::app_host_report.json is $size bytes - refusing to upload a corrupt artefact"
            echo "=== reports/ contents ==="; ls -la reports/
            exit 1
          fi
          echo "app_host_report.json: $(wc -c < reports/app_host_report.json | tr -d ' ') bytes"

          if [ -s reports/mechanism_probe.json ]; then
            echo "mechanism_probe.json: $(wc -c < reports/mechanism_probe.json | tr -d ' ') bytes"
          else
            echo "::warning::mechanism_probe.json is absent or empty. Nothing in this arm"
            echo "  consumes it - the L-14/L-11/L-16 probe evidence is missing from"
            echo "  this run and the artefact will not carry it."
          fi
          echo "=== app_host_report.json ==="
          head -c 600 reports/app_host_report.json; echo

      - name: Upload app host artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-app-host-${{ github.sha }}
          path: |
            reports/app_host_report.json
            reports/app_host_mapped_extensions.txt
            reports/app_host_server.log
            reports/mechanism_probe.json
          retention-days: 30

  perf-preflight:
    name: perf preflight (two distinct hosts?)
    runs-on: [self-hosted, linux, perf-load]
    if: github.event_name == 'workflow_dispatch'
    needs: perf-app-host
    steps:
      - name: Prove the load host can reach the app host
        # THE GATE for the whole arm, and the reason the same-host refusal in
        # run_perf_baseline.sh is satisfied rather than bypassed.
        #
        # If this host could reach the app host at loopback or at one of its own
        # addresses, the two runners would be the same machine wearing two names
        # and every number from the load job would be a contention figure. So:
        # record THIS host's addresses, record the app host's, and fail if they
        # intersect.
        env:
          APP_HOST: ${{ needs.perf-app-host.outputs.host }}
        run: |
          set -euo pipefail
          echo "load host name    : $(hostname -s)"
          echo "app host address  : ${APP_HOST}"

          load_ips="$(hostname -I | tr ' ' '\n' | sort -u)"
          echo "load host addresses:"; echo "${load_ips}"

          if [ -z "${APP_HOST}" ]; then
            echo "::error::the app host reported no address; its job produced nothing usable"
            exit 1
          fi
          if echo "${load_ips}" | grep -qx "${APP_HOST}"; then
            echo "::error::the app host address ${APP_HOST} is bound on the LOAD host."
            echo "The load generator and the server must be different machines, or every"
            echo "figure measures CPU contention instead of latency."
            exit 1
          fi
          if [ "${APP_HOST}" = "127.0.0.1" ] || [ "${APP_HOST}" = "localhost" ]; then
            echo "::error::the app host address is loopback"
            exit 1
          fi

          # And prove it is actually reachable, which is the security-group check
          # that most often fails on a fresh pair.
          code="$(curl -s --noproxy '*' -m 10 -o /dev/null -w '%{http_code}' \
                  "http://${APP_HOST}:8000/api/v1/health" || echo 000)"
          echo "health from load host: ${code}"
          if [ "${code}" != "200" ]; then
            echo "::error::cannot reach http://${APP_HOST}:8000 from the load host (${code})."
            echo "Most often a security group between the two VMs. A number from a"
            echo "run that cannot reach the server is not a measurement."
            exit 1
          fi

          start=$(date +%s%N)
          curl -s --noproxy '*' -m 10 -o /dev/null "http://${APP_HOST}:8000/api/v1/health"
          echo "observed LAN RTT ms: $(( ($(date +%s%N) - start) / 1000000 ))"

          echo "two distinct hosts confirmed; the same-host refusal is satisfied honestly"

  perf-load:
    name: perf load generation (perf-load)
    runs-on: [self-hosted, linux, perf-load]
    if: github.event_name == 'workflow_dispatch'
    needs: [perf-app-host, perf-preflight]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Create venv
        run: uv venv

      - name: Install package with dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Download the app host's report
        # run_perf_baseline.sh validates the app host's report and refuses to run
        # without it (exit 6). That report is produced ON THE APP HOST, from the
        # server's own process - which is the whole point of it - so it has to be
        # carried here by hand, exactly as scripts/run_perf_baseline.sh's header
        # describes. Reading it off the load host instead would report what the
        # load host believes about the server, which is the drift T-8 exists to
        # prevent.
        uses: actions/download-artifact@v4
        with:
          name: perf-app-host-${{ github.sha }}
          path: reports

      - name: Confirm the carried report is the app host's own
        # Cheap, and it turns a silent drift into a refusal. The report records
        # the app host's platform and event loop; if those do not look like a
        # Linux/uvloop server, the wrong file arrived and every downstream figure
        # would describe the wrong machine.
        run: |
          set -euo pipefail
          # The message distinguishes "never arrived" from "arrived empty",
          # because they have completely different causes and the old wording
          # named the wrong one: a zero-byte report reads exactly like a missing
          # one under `test -s`, and sent the reader looking at transport.
          if [ ! -f reports/app_host_report.json ]; then
            echo "::error::no app_host_report.json was carried from the app host AT ALL."
            echo "  check the Upload app host artefacts step in perf app host; the"
            echo "  download itself is reported separately by download-artifact."
            ls -la reports/ 2>/dev/null || echo "  (no reports/ directory)"
            exit 1
          fi
          if [ ! -s reports/app_host_report.json ]; then
            echo "::error::app_host_report.json was carried but is EMPTY (0 bytes)."
            echo "  This is a PRODUCER fault, not a transport one: something"
            echo "  truncated the file on the app host after it was written."
            exit 1
          fi
          uv run python - <<'PYEOF'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/app_host_report.json").read_text())
          host = report.get("app_host", report)
          print("carried app_host_report.json:", json.dumps(host)[:400])
          for key in ("event_loop", "http"):
              value = host.get(key) if isinstance(host, dict) else None
              print(f"  {key}: {value}")
          PYEOF

      - name: Measure against the app host
        # --host is the app host's PRIVATE address. NOT its public one: see the
        # header comment for why the public address would measure the internet.
        env:
          APP_HOST: ${{ needs.perf-app-host.outputs.host }}
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          set -euo pipefail
          mkdir -p reports
          ./scripts/run_perf_baseline.sh \
            --host "http://${APP_HOST}:8000" \
            --users "${PERF_USERS:-20}" \
            --rate "${PERF_RATE:-10}" \
            --duration "${PERF_DURATION:-60s}" \
            2>&1 | tee reports/load_run.log

      - name: Upload load artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-load-${{ github.sha }}
          path: reports/
          retention-days: 30

  perf-teardown:
    name: perf teardown (perf-app)
    runs-on: [self-hosted, linux, perf-app]
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [perf-app-host, perf-preflight, perf-load]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop all Docker Compose services
        # `always()`, so a failed load run still leaves the machine clean - and
        # `down --volumes` so the next run does not inherit a postgres volume
        # carrying the previous run's schema and rows.
        #
        # The override file is regenerated here rather than relied on from the
        # app-host job: this job may run after a checkout that never wrote it.
        run: |
          set -uo pipefail
          cat > docker-compose.perf.yml <<'YAML'
          services:
            web:
              command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000
              volumes: []
          YAML
          docker compose -f docker-compose.yml -f docker-compose.perf.yml \
            down --remove-orphans --volumes || true
          echo "All services stopped and cleaned up"
          docker ps --format "table {{.Names}}\t{{.Status}}" || true

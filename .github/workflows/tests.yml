name: Backend CI

# Every push and PR runs the full check set. These triggers used to carry
# `paths-ignore: ['**/*.md', 'docs/**']`, which meant a change to a doc
# pointer or a CI gate alone never started this workflow — the checks were
# present in the file and unrunnable in practice. Dropping the filter is
# what makes the gates below mandatory rather than advisory.
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Create venv
        run: uv venv

      - name: Install package with dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Run Ruff
        run: uv run ruff check src

      # s92p.7: the cross-module seam rule in ARCHITECTURE.md. Without a
      # step, the rule is prose; this is what makes it bind on a new
      # cross-module service import.
      - name: Run cross-module seam gate
        run: uv run python scripts/check_cross_module_seams.py

      # io15.8: a mutating endpoint with no response_model sends an
      # undocumented body, and a too-narrow one silently strips fields. The
      # gate reports the endpoints that genuinely cannot be annotated, with
      # the reason, so the exceptions stay reviewable.
      - name: Run mutation response model gate
        run: uv run python scripts/check_mutation_response_models.py

      # Every rooted `src/…`, `tests/…`, `scripts/…`, `docs/…` and `.github/…`
      # path in a document is a claim that the path exists, and the root
      # AGENTS.md states the gate is mandatory for that reason. Unconditional:
      # a `paths:` filter here would stop a documentation-only PR from
      # triggering this workflow, and the gate could no longer fire on the rot
      # it exists to catch. `tests/unit/scripts/test_doc_gate_wiring.py` fails
      # if a filter is ever reintroduced, or if this step is deleted.
      - name: Run doc path integrity gate
        run: uv run python scripts/check_doc_paths.py

      # sj09.6: a forked Alembic history fails at DEPLOY time
      # ("Multiple head revisions are present") and the app never boots.
      # Single-head and graph linearity are static properties of the
      # revision files, so they belong in the database-free lint job rather
      # than in the tests job.
      - name: Run migration graph gate
        run: uv run python scripts/check_migration_graph.py

      # sj09.6: the same class of rot in executable form. A script that
      # imports a module that no longer exists still passes every static
      # gate here; only importing it proves the operator-facing entry
      # points resolve.
      - name: Run operator script import gate
        run: uv run python scripts/check_script_imports.py

      # nrgi.7: a list service that changes its WHERE or ORDER BY keeps
      # working and silently loses the index that was the only reason the
      # query was cheap — a correct answer from a sequential scan is still a
      # correct answer, so no test catches it. The checker is pure AST: it
      # reads models.py and the declared predicates, so it needs no database
      # in the lint job.
      - name: Run index predicate coverage gate
        run: uv run python scripts/check_index_predicate_coverage.py

      # v8kz: Alembic compares indexes by NAME, and this repo declares no
      # naming_convention, so an index the ORM and the migration define
      # differently produces NO autogenerate diff. A migrated database and a
      # create_all database then hold different schemas. The gate compares
      # columns IN ORDER, the partial predicate and uniqueness — not just the
      # name, which is the whole point. Pure AST, no database.
      - name: Run index definition consistency gate
        run: uv run python scripts/check_index_definition_consistency.py

      # A column mapped on a model but never created by a migration is
      # invisible to every other gate here: create_all DERIVES the schema from
      # the ORM, so a create_all database always has it, and the tests run
      # against such a database. On a migrated database the query then raises
      # UndefinedColumnError. `pricing.currency` was exactly this, and adding
      # this gate immediately surfaced three more (passkey_credentials.aaguid
      # and .transports, magic_links.user_agent, user_sso_connections
      # .provider_email). Pure AST, no database.
      - name: Run schema parity gate
        run: uv run python scripts/check_schema_parity.py

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Create venv
        run: uv venv

      - name: Install package with dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Run mypy
        run: uv run mypy src --config-file pyproject.toml
        env:
          ENVIRONMENT: local
          SECRET_KEY: "12345678901234567890123456789012"

  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Create venv
        run: uv venv

      - name: Install package with dev dependencies
        run: uv pip install -e ".[dev]"

      # Real Alembic parity, against a genuinely migrated database.
      #
      # Runs in a SEPARATE database on purpose: `alembic upgrade head` here
      # would leave test_db with the migration-08 RLS policies enabled, whereas
      # the suite currently runs against a create_all schema that has none.
      # Flipping that is a much larger change than adding a gate, so this gets
      # its own database and test_db is left alone.
      #
      # NON-BLOCKING, deliberately. Measured on this repo at 7de0ff2a: ~395
      # diffs, of which ZERO are "added column" (the defect class that actually
      # breaks a migrated database). The rest are index naming, column
      # comments and TIMESTAMP type comparisons — long-standing, and exactly
      # the classes this repo deliberately gates with precise AST checks
      # instead (see check_index_definition_consistency.py: "Alembic compares
      # indexes by NAME, and this repo declares no naming_convention").
      #
      # As a BLOCKING gate this would be red on day one and stay red, which
      # trains people to ignore red. It runs so drift is VISIBLE and
      # reviewable in the job log; the blocking gate for missing columns is
      # `Run schema parity gate` in the lint job. Flip continue-on-error to
      # false only after the noise is reconciled.
      # Step-level env is NOT inherited from the service block or from the
      # "Run tests" step, so every step here declares what it needs.
      - name: Create parity check database
        run: |
          PGPASSWORD="${POSTGRES_PASSWORD}" psql -h localhost -U "${POSTGRES_USER}" -d postgres             -c "DROP DATABASE IF EXISTS parity_check;"             -c "CREATE DATABASE parity_check;"
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      # `src/migrations/env.py` imports `src.app.models`, which imports the
      # settings object, and `Settings` includes `FirstUserSettings`, whose
      # ADMIN_PASSWORD is a REQUIRED field. No migration step reads or uses
      # that password; the value only has to satisfy the field validator.
      - name: Apply migrations to parity check database
        run: uv run alembic -c src/alembic.ini upgrade head
        env:
          ENVIRONMENT: local
          SECRET_KEY: "12345678901234567890123456789012"
          # Throwaway CI fixture, NOT a real credential. Must satisfy
          # FirstUserSettings: >=16 chars with lower, upper, digit and one
          # of [@$!%*?&].
          ADMIN_PASSWORD: "NotASecretCiFixture1!@#"
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parity_check

      - name: Run alembic parity check (non-blocking, see comment above)
        continue-on-error: true
        run: uv run alembic -c src/alembic.ini check
        env:
          ENVIRONMENT: local
          SECRET_KEY: "12345678901234567890123456789012"
          ADMIN_PASSWORD: "NotASecretCiFixture1!@#"
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parity_check

      - name: Run tests
        run: uv run pytest
        env:
          ENVIRONMENT: local
          SECRET_KEY: "12345678901234567890123456789012"

          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db

          REDIS_QUEUE_HOST: localhost
          REDIS_QUEUE_PORT: 6379
          REDIS_QUEUE_PASSWORD: ""

          REDIS_CACHE_HOST: localhost
          REDIS_CACHE_PORT: 6379
          REDIS_CACHE_PASSWORD: ""

          CRUD_ADMIN_REDIS_HOST: localhost
          CRUD_ADMIN_REDIS_PORT: 6379
          CRUD_ADMIN_REDIS_PASSWORD: ""
name: Backend CI

# Runs on every push and PR. Removed `paths-ignore` so doc-only changes trigger the workflow.
# Removed the two-host performance arm to prevent production stack boot failures from blocking correctness gates. Findings are in beads FastAPI_saas-8rez, mrv3, po5h, leep, 6gai, 6ybl, u788, 5my8, gled, wxqr, and upr0.
on:
  push:
  pull_request:
  workflow_dispatch:

# Cancels superseded runs to save CI minutes.
# Uses a shared concurrency group across workflows to cancel in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Merged from the standalone "Performance Validation" workflow to reduce redundant runs and annotations.
  # The validator uses only stdlib and structlog (no DB/Redis).
  isomorphism:
    name: Isomorphism Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Install project
        run: uv sync

      - name: Run isomorphism tests
        # Runs from the repository root. Uses stdlib and structlog only.
        # The env vars are dummy values required by `settings` validation during import, not real DB credentials.
        env:
          ENVIRONMENT: local
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          SECRET_KEY: "12345678901234567890123456789012"
          ADMIN_PASSWORD: "NotASecretCiFixture1!@#"
        run: uv run python scripts/perf-validation/isomorphism_validator.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Create venv
        run: uv venv

      - name: Install package with dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Run Ruff
        run: uv run ruff check src

      # Enforces the cross-module seam rule (ARCHITECTURE.md s92p.7).
      - name: Run cross-module seam gate
        run: uv run python scripts/checks/cross_module_seams.py

      # Ensures mutating endpoints have valid response_models (io15.8).
      - name: Run mutation response model gate
        run: uv run python scripts/checks/mutation_response_models.py

      # Validates paths in documentation exist (AGENTS.md). Runs unconditionally to catch doc rot.
      - name: Run doc path integrity gate
        run: uv run python scripts/checks/doc_paths.py

      # Checks Alembic migration graph linearity (sj09.6) statically to prevent deploy failures.
      - name: Run migration graph gate
        run: uv run python scripts/checks/migration_graph.py

      # Validates operator script imports resolve (sj09.6).
      - name: Run operator script import gate
        run: uv run python scripts/checks/script_imports.py

      # Checks index predicate coverage (nrgi.7) via AST to prevent silent sequential scans.
      - name: Run index predicate coverage gate
        run: uv run python scripts/checks/index_predicate_coverage.py

      # Compares index columns, predicates, and uniqueness via AST (v8kz) to catch schema drift.
      - name: Run index definition consistency gate
        run: uv run python scripts/checks/index_definition_consistency.py

      # AST check for columns mapped on models but missing in migrations, preventing UndefinedColumnError on migrated DBs.
      - name: Run schema parity gate
        run: uv run python scripts/checks/schema_parity.py

      # Checks log templates for empty slots that cause truncated operator output.
      - name: Run log template gate
        run: uv run python scripts/checks/log_templates.py

      # Enforces the modular-monolith contract (router.py, service.py, models/schemas) in `src/app/modules`.
      - name: Run module structure gate
        run: uv run python scripts/checks/module_structure.py

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Create venv
        run: uv venv

      - name: Install package with dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Run mypy
        run: uv run mypy src --config-file pyproject.toml
        env:
          ENVIRONMENT: local
          SECRET_KEY: "12345678901234567890123456789012"

  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Create venv
        run: uv venv

      - name: Install package with dev dependencies
        run: uv pip install -e ".[dev]"

      # Runs Alembic parity check against a genuinely migrated database.
      # Uses a separate DB to avoid enabling migration-08 RLS policies on `test_db`.
      # `scripts/checks/schema_parity.py` in the lint job compares column names
      # and types; this step still covers policies, constraints and server defaults.
      # Non-blocking: surfaces long-standing drift (index names, timestamps, policies) without failing the build.
      # Keep `continue-on-error: true` until the ~395 pre-existing diffs are triaged.
      # Step-level env is not inherited, so every step declares what it needs.
      - name: Create parity check database
        run: |
          PGPASSWORD="${POSTGRES_PASSWORD}" psql -h localhost -U "${POSTGRES_USER}" -d postgres             -c "DROP DATABASE IF EXISTS parity_check;"             -c "CREATE DATABASE parity_check;"
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      # `ADMIN_PASSWORD` is required by `FirstUserSettings` validation during import.
      - name: Apply migrations to parity check database
        run: uv run alembic -c src/alembic.ini upgrade head
        env:
          ENVIRONMENT: local
          SECRET_KEY: "12345678901234567890123456789012"
          ADMIN_PASSWORD: "NotASecretCiFixture1!@#"
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parity_check

      - name: Run alembic parity check (non-blocking)
        continue-on-error: true
        run: uv run alembic -c src/alembic.ini check
        env:
          ENVIRONMENT: local
          SECRET_KEY: "12345678901234567890123456789012"
          ADMIN_PASSWORD: "NotASecretCiFixture1!@#"
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parity_check

      # Populates `test_db` using `create_all` instead of `alembic upgrade head` to avoid enabling RLS policies.
      # Required because `httpx.ASGITransport` tests bypass lifespan startup, leaving `test_db` empty and causing UndefinedTableError.
      # Uses `create_tables()` to match local dev schema creation.
      - name: Create schema in test database
        run: uv run python -c "import asyncio; from src.app.core.setup import create_tables; asyncio.run(create_tables())"
        env:
          ENVIRONMENT: local
          SECRET_KEY: "12345678901234567890123456789012"
          ADMIN_PASSWORD: "NotASecretCiFixture1!@#"
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db

      - name: Run tests
        run: uv run pytest
        env:
          ENVIRONMENT: local
          SECRET_KEY: "12345678901234567890123456789012"

          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db

          REDIS_QUEUE_HOST: localhost
          REDIS_QUEUE_PORT: 6379
          REDIS_QUEUE_PASSWORD: ""

          REDIS_CACHE_HOST: localhost
          REDIS_CACHE_PORT: 6379
          REDIS_CACHE_PASSWORD: ""

          CRUD_ADMIN_REDIS_HOST: localhost
          CRUD_ADMIN_REDIS_PORT: 6379
          CRUD_ADMIN_REDIS_PASSWORD: ""
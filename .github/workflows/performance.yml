name: Performance Benchmarks

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/performance/**'
      - 'tests/benchmarks/**'

  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/performance/**'
      - 'tests/benchmarks/**'

  workflow_dispatch:
    inputs:
      baseline_update:
        description: 'Update repository baseline after run'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: perf-benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  BENCHMARK_REGRESSION_THRESHOLD: '10'

defaults:
  run:
    shell: bash

jobs:
  benchmark:
    name: Run Performance Benchmarks
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Install dependencies
        run: |
          uv sync --frozen || uv sync
          uv pip install pytest-benchmark

      - name: Prepare directories
        run: |
          mkdir -p tests/benchmarks/baselines
          mkdir -p .benchmark-artifacts

      - name: Run benchmarks
        run: |
          uv run pytest tests/performance/ \
            --benchmark-only \
            --benchmark-json=benchmark-results.json \
            --benchmark-columns=min,max,mean,stddev,median,ops \
            --benchmark-sort=mean \
            --benchmark-warmup=on \
            -v
        env:
          ENVIRONMENT: local
          # Quoted: unquoted, YAML parses the 32 digits as a number and
          # GitHub renders it in scientific notation, which fails the >=32
          # character check. Throwaway fixture, not a real credential.
          SECRET_KEY: "12345678901234567890123456789012"
          # Must satisfy FirstUserSettings: >=16 chars with lower, upper,
          # digit and one of [@$!%*?&]. The previous value was 10 chars and
          # also on the known-leaked-password denylist.
          ADMIN_PASSWORD: "NotASecretCiFixture1!@#"

          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0

          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: test_db

          REDIS_CACHE_HOST: localhost
          REDIS_CACHE_PORT: 6379
          REDIS_CACHE_PASSWORD: ""

          REDIS_QUEUE_HOST: localhost
          REDIS_QUEUE_PORT: 6379
          REDIS_QUEUE_PASSWORD: ""

          CRUD_ADMIN_REDIS_HOST: localhost
          CRUD_ADMIN_REDIS_PORT: 6379
          CRUD_ADMIN_REDIS_PASSWORD: ""

      - name: Compare with repository baseline
        id: compare
        run: |
          python <<'PY'
          import json
          import os
          from pathlib import Path

          threshold = float(os.environ["BENCHMARK_REGRESSION_THRESHOLD"])
          baseline_path = Path("tests/benchmarks/baselines/main.json")
          current_path = Path("benchmark-results.json")
          summary_path = Path(".benchmark-artifacts/compare-summary.md")

          current = json.loads(current_path.read_text())
          current_benchmarks = {
              b["name"]: b
              for b in current.get("benchmarks", [])
              if "name" in b and "stats" in b and "mean" in b["stats"]
          }

          lines = []
          lines.append("## Performance Benchmark Results")
          lines.append("")
          lines.append(f"**Commit:** `{os.environ.get('GITHUB_SHA', 'unknown')}`")
          lines.append(f"**Branch:** `{os.environ.get('GITHUB_REF_NAME', 'unknown')}`")
          lines.append(f"**Regression threshold:** `{threshold}%`")
          lines.append("")

          if not baseline_path.exists():
              lines.append("No repository baseline found at `tests/benchmarks/baselines/main.json`.")
              lines.append("Comparison skipped for this run.")
              summary_path.write_text("\n".join(lines))
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("has_baseline=false\n")
                  fh.write("regression=false\n")
              raise SystemExit(0)

          baseline = json.loads(baseline_path.read_text())
          baseline_benchmarks = {
              b["name"]: b
              for b in baseline.get("benchmarks", [])
              if "name" in b and "stats" in b and "mean" in b["stats"]
          }

          regressions = []
          lines.append("| Test | Baseline Mean (ms) | Current Mean (ms) | Change | Status |")
          lines.append("|------|--------------------|-------------------|--------|--------|")

          names = sorted(set(current_benchmarks) & set(baseline_benchmarks))
          for name in names:
              base_mean = baseline_benchmarks[name]["stats"]["mean"]
              curr_mean = current_benchmarks[name]["stats"]["mean"]
              if base_mean == 0:
                  pct = 0.0
              else:
                  pct = ((curr_mean - base_mean) / base_mean) * 100

              status = "OK"
              if pct > threshold:
                  status = "REGRESSION"
                  regressions.append((name, base_mean, curr_mean, pct))

              lines.append(
                  f"| {name} | {base_mean * 1000:.3f} | {curr_mean * 1000:.3f} | {pct:+.2f}% | {status} |"
              )

          if not names:
              lines.append("| No shared benchmark names between current results and baseline | - | - | - | - |")

          lines.append("")
          lines.append("### Target thresholds")
          lines.append("| Benchmark area | Target |")
          lines.append("|----------------|--------|")
          lines.append("| /users/me | < 15ms |")
          lines.append("| /auth/refresh | < 10ms |")
          lines.append("| AI chat DB | < 100ms |")
          lines.append("| Cache operations | < 5ms |")
          lines.append("| Serialization | < 0.1ms each |")

          summary_path.write_text("\n".join(lines))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("has_baseline=true\n")
              fh.write(f"regression={'true' if regressions else 'false'}\n")

          if regressions:
              print("Performance regressions detected:")
              for name, base_mean, curr_mean, pct in regressions:
                  print(f"- {name}: {base_mean*1000:.3f}ms -> {curr_mean*1000:.3f}ms ({pct:+.2f}%)")
              raise SystemExit(1)
          PY

      - name: Add summary to workflow
        if: always()
        run: |
          if [ -f .benchmark-artifacts/compare-summary.md ]; then
            cat .benchmark-artifacts/compare-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No benchmark summary generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            benchmark-results.json
            .benchmark-artifacts/compare-summary.md
          retention-days: 30

      - name: Update repository baseline
        if: >
          always() &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.baseline_update))
        run: |
          # PF-12/AMD-A13 + A-13: tests/benchmarks/baselines/main.json is a
          # hand-authored stub and must NEVER be overwritten with shared-runner
          # numbers — this step used to commit benchmark-results.json over it
          # on every main push, destroying the stub. It now only REPORTS; the
          # raw numbers already ride the benchmark-results artifact above.
          echo "Baseline NOT overwritten: main.json is a hand-authored stub (A-13); shared-runner numbers ride the benchmark-results artifact instead." >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REGRESSION_THRESHOLD: ${{ env.BENCHMARK_REGRESSION_THRESHOLD }}
        with:
          script: |
            const fs = require('fs');

            let results = {};
            try {
              results = JSON.parse(fs.readFileSync('benchmark-results.json', 'utf8'));
            } catch (e) {
              console.log('Could not parse benchmark results');
              return;
            }

            const benchmarks = results.benchmarks || [];
            let table = '| Test | Mean | Ops/sec | Target |\n|------|------|---------|--------|\n';

            const targetMap = {
              users_me: '15ms',
              auth_refresh: '10ms',
              ai_chat_db: '100ms',
              cache_operations: '5ms',
              serialization: '0.1ms'
            };

            for (const b of benchmarks.slice(0, 10)) {
              const mean = b?.stats?.mean ? (b.stats.mean * 1000).toFixed(3) : 'N/A';
              const ops = b?.stats?.ops ? b.stats.ops.toFixed(0) : 'N/A';
              const target = b?.extra_info?.target_ms ?? targetMap[b.name] ?? 'N/A';
              table += `| ${b.name} | ${mean}ms | ${ops} | ${target} |\n`;
            }

            const body =
              `## 📊 Performance Benchmark Results\n\n` +
              `${table}\n` +
              `Regression threshold: ${process.env.REGRESSION_THRESHOLD}%`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
                body
              });

  microbenchmark:
    # A-9 second arm (FastAPI_saas-u71j): microbenchmark ONLY. This job runs
    # the 8 protocol-migrated microsecond benchmarks on a shared runner
    # against co-located stores. Its numbers are NOT a capacity measurement
    # and can satisfy NO Gate A checkbox (see the artefact's
    # gate_a_satisfiable field). It has no compare step, no baseline
    # overwrite, and no p95/throughput/RTT columns — by design, not by
    # omission: a shared-runner figure quoted beside a capacity claim is
    # exactly the misreading this label exists to prevent.
    name: microbenchmark only - shared runner, co-located stores, NOT a capacity measurement
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Install dependencies
        run: |
          uv sync --frozen || uv sync

      - name: Assert uvloop installed (u0ko platform claim)
        # AMD A-9 (FastAPI_saas-u0ko): this arm's platform claim is ubuntu +
        # uvloop. uv sync installs uvloop>=0.19.0 on non-Windows (pyproject
        # marker sys_platform != 'win32'); this step fails the job LOUD if the
        # install ever stops providing it, instead of silently measuring a
        # different event loop.
        run: |
          uv run python -c "import uvloop; print('uvloop', uvloop.__version__)"

      - name: Run microbenchmarks with loop-lag probe
        run: |
          uv run python scripts/probe_loop_lag.py --rate 100 --duration 600 --output loop-lag.json &
          PROBE_PID=$!
          uv run pytest tests/benchmarks/test_p2_micros.py tests/benchmarks/test_auth_perf.py tests/benchmarks/bench_cache_invalidation.py tests/benchmarks/test_nrgi3_scan_cost.py tests/benchmarks/bench_r1_opus.py tests/benchmarks/test_passkey_lookup.py tests/benchmarks/test_post_optimization.py tests/benchmarks/test_r5_micros.py -q -p no:randomly
          PYTEST_RC=$?
          kill $PROBE_PID || true
          wait $PROBE_PID || true
          uv run python - <<'PYEOF'
          import json
          import uvloop
          lag = json.load(open("loop-lag.json"))
          run = {
            "label": "microbenchmark only - shared runner, co-located stores, NOT a capacity measurement",
            "gate_a_satisfiable": False,
            "uvloop": uvloop.__version__,
            "loop_lag": lag,
          }
          json.dump(run, open("microbench-run.json", "w"), indent=2)
          PYEOF
          exit $PYTEST_RC
        env:
          ENVIRONMENT: local
          # Quoted: unquoted, YAML parses the 32 digits as a number and
          # GitHub renders it in scientific notation, which fails the >=32
          # character check. Throwaway fixture, not a real credential.
          SECRET_KEY: "12345678901234567890123456789012"
          # Must satisfy FirstUserSettings: >=16 chars with lower, upper,
          # digit and one of [@$!%*?&]. The previous value was 10 chars and
          # also on the known-leaked-password denylist.
          ADMIN_PASSWORD: "NotASecretCiFixture1!@#"

          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0

          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: test_db

          REDIS_CACHE_HOST: localhost
          REDIS_CACHE_PORT: 6379
          REDIS_CACHE_PASSWORD: ""

          REDIS_QUEUE_HOST: localhost
          REDIS_QUEUE_PORT: 6379
          REDIS_QUEUE_PASSWORD: ""

          CRUD_ADMIN_REDIS_HOST: localhost
          CRUD_ADMIN_REDIS_PORT: 6379
          CRUD_ADMIN_REDIS_PASSWORD: ""

      - name: Upload microbenchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microbench-run-${{ github.sha }}
          path: |
            microbench-run.json
            loop-lag.json
          retention-days: 30

  benchmark-history:
    name: Track Benchmark History
    runs-on: ubuntu-latest
    needs: benchmark
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Download current results
        uses: actions/download-artifact@v5
        with:
          name: benchmark-results-${{ github.sha }}
          path: ./results

      - name: Prepare history snapshot
        run: |
          mkdir -p benchmark-history
          cp ./results/benchmark-results.json benchmark-history/${{ github.sha }}.json
          cp ./results/compare-summary.md benchmark-history/${{ github.sha }}-summary.md || true

      - name: Upload history snapshot
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-history-${{ github.sha }}
          path: benchmark-history/
          retention-days: 90
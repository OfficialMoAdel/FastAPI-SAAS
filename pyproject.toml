[project]
name = "fastapi-saas"
version = "0.1.0"
description = "Production-ready, modular FastAPI SaaS  with async support, multi-tenancy, and standardized patterns."
authors = [{ name = "SaaS Framework Maintainers", email = "maintainers@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12, <4"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic[email]>=2.6.1",
    "fastapi>=0.109.1",
    "uvicorn>=0.27.0",
    "httptools>=0.6.1",
    "uuid6>=2024.1.12",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "SQLAlchemy-Utils>=0.41.1",
    "PyJWT>=2.8.0",
    "SQLAlchemy>=2.0.25",
    "python-multipart>=0.0.9",
    "greenlet>=2.0.2",
    "httpx>=0.26.0",
    "pydantic-settings>=2.0.3",
    "redis>=5.0.1",
    "arq>=0.25.0",
    "bcrypt>=4.1.1",
    "fastcrud>=0.19.2",
    "crudadmin>=0.4.2",
    "gunicorn>=23.0.0",
    # Dev tools moved to [project.optional-dependencies] dev section
    "jinja2>=3.1.0",
    "cryptography>=45.0.3",
    "structlog>=24.1.0",
    "aiosmtplib>=3.0.0",
    # "py_webauthn>=2.0.0",
    "authlib>=1.3.0",
    "webauthn>=2.0.0",
    # Storage & Observability (Phase 4/7)
    "azure-storage-blob>=12.0.0",
    "aiofiles>=23.0.0",
    "opentelemetry-api>=1.20.0",
    # Billing & AI (Phase 3/5)
    "stripe>=8.0.0",
    "ollama>=0.3.0",
    # Performance (Phase 2)
    "orjson>=3.9.0",
    # Unix-only async event loop (not available on Windows)
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "xxhash>=3.6.0",
    "bitarray>=3.8.0",
    "cachetools>=6.2.4",
    # Attack-scan prefilter (Aho-Corasick); pure-stdlib str.find fallback if absent
    "pyahocorasick>=2.0.0",
    # MFA (Phase 3)
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.0",
    # Multi-Provider AI (Phase 4)
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "filetype>=1.2.0",
    "pytest-timeout>=2.4.0",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.2",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
    "faker>=26.0.0",
    "mypy>=1.8.0",
    "types-redis>=4.6.0",
    "ruff>=0.1.0",
    "locust>=2.43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.hatch.build.targets.wheel]
include = ["src/"]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "F", # Pyflakes
    # https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
    "E", # pycodestyle
    "W", # Warning
    # https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    # https://docs.astral.sh/ruff/rules/#mccabe-c90
    "C", # Complexity (mccabe+) & comprehensions
    # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "UP", # pyupgrade
    # https://docs.astral.sh/ruff/rules/#isort-i
    "I", # isort
    # https://docs.astral.sh/ruff/rules/#flake8-tidy-imports-tid
    "TID", # tidy-imports (P1-20: enforces the package-root boundary below)
    # https://docs.astral.sh/ruff/rules/#flake8-blind-except-ble
    "BLE", # blind-except (P1-17: enforced on the boot path only; the
            # per-file-ignores below scope it until the repo-wide campaign)
]
ignore = [
    # https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
    "E402", # module level import not at top of file
    # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "UP006", # use-pep585-annotation
    "UP007", # use-pep604-annotation
    "E741",  # Ambiguous variable name
    # "UP035", # deprecated-assertion
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401", # unused import
    "F403", # star imports
]
"src/migrations/*" = ["E501"]
# P1-17: BLE001 is enforced on the boot path only
# (src/app/main.py, src/app/core/setup.py, src/app/api/monitoring.py,
# src/app/core/job_monitoring.py). Everything below is deferred to the
# repo-wide blind-except campaign — do NOT add new broad excepts here
# without a justification; extend enforcement instead.
"src/app/{modules,clients,middleware,admin,transport,models,schemas,shared,templates}/**" = ["BLE001"]
"src/app/api/{deps,v1}/**" = ["BLE001"]
"src/app/api/{__init__,openapi}.py" = ["BLE001"]
"src/app/{__init__,events}.py" = ["BLE001"]
"src/app/core/{cache,config,db,events,exceptions,monitoring,observability,rbac,resilience,security,tenancy,utils,worker}/**" = ["BLE001"]
"src/app/core/{__init__,env_validator,errors,health,json_utils,logger,middleware_exempt,pagination,redis_provider,schemas}.py" = ["BLE001"]
"src/{migrations,scripts}/**" = ["BLE001"]
"tests/**" = ["BLE001", "TID"]
# P1-20: TID (banned-api) per-file exemptions. The package-root rule
# applies to cross-module production imports; these are sanctioned:
# - api/v1/__init__.py is the composition root — it MUST import routers to mount them.
# - modules/*/__init__.py are the facades — deep imports inside lazy __getattr__ ARE the seam.
# (tests/** above: white-box tests pin internals + mock targets by design.)
"src/app/api/v1/__init__.py" = ["TID"]
"src/app/modules/*/__init__.py" = ["TID"]
"scripts/**" = ["BLE001"]

[tool.ruff.lint.mccabe]
max-complexity = 24

# Module boundary enforcement: ban internal cross-module imports
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"src.app.modules.auth.service".msg = "Import from 'src.app.modules.auth' instead of internal files"
"src.app.modules.auth.router".msg = "Import from 'src.app.modules.auth' instead of internal files"
"src.app.modules.users.service".msg = "Import from 'src.app.modules.users' instead of internal files"
"src.app.modules.users.router".msg = "Import from 'src.app.modules.users' instead of internal files"
"src.app.modules.tenants.service".msg = "Import from 'src.app.modules.tenants' instead of internal files"
"src.app.modules.posts.service".msg = "Import from 'src.app.modules.posts' instead of internal files"


[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::PendingDeprecationWarning:starlette.formparsers",
    # Suppress RuntimeWarning for async mock issues in tests (fakeredis pipeline mocking)
    "ignore::RuntimeWarning",
    # Suppress FastCRUD schema_to_select deprecation warnings
    "ignore::DeprecationWarning:",
    # Suppress Pydantic class-based Config deprecation
    "ignore::DeprecationWarning:pydantic",
    # Suppress unknown pytest mark warnings
    "ignore::pytest.PytestUnknownMarkWarning",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Prevent the suite from hanging forever on a leaked task/connection.
# A true hang (never completes) will be killed and dump a traceback showing
# the exact blocking call. 300s is ~400x the per-test average, so it only
# fires on genuine hangs, not slow tests.
timeout = 300
timeout_method = "thread"
markers = [
    "e2e: marks tests as end-to-end tests (require full stack)",
    "uses_real_redis: marks tests that require a real Redis instance",
    "slow: marks tests as slow running",
    "benchmark: marks tests as performance benchmarks",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "faker>=37.3.0",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.0",
    "pre-commit>=4.3.0",
    "pytest-asyncio==0.24.0", # 0.24.0 supports loop_scope; 0.25+ has event loop bugs
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "structlog>=25.5.0",
    "types-aiofiles>=25.1.0.20251011",
    "types-cachetools>=6.2.0.20251022",
    "ruff>=0.11.13",
    "mypy>=1.16.0",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "."
namespace_packages = true
packages = ["src"]
check_untyped_defs = true
disallow_any_generics = false
# ignore_errors = true

[[tool.mypy.overrides]]
module = "src.app.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "src.app.core.*"
disallow_untyped_defs = true
ignore_errors = false

[project]
name = "fastapi-saas"
version = "0.1.0"
description = "Production-ready, modular FastAPI SaaS  with async support, multi-tenancy, and standardized patterns."
authors = [{ name = "SaaS Framework Maintainers", email = "maintainers@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13, <4"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic[email]>=2.6.1",
    "fastapi>=0.109.1",
    "uvicorn>=0.27.0",
    "httptools>=0.6.1",
    "uuid6>=2024.1.12",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "SQLAlchemy-Utils>=0.41.1",
    "PyJWT>=2.8.0",
    "SQLAlchemy>=2.0.25",
    "python-multipart>=0.0.9",
    "greenlet>=2.0.2",
    "httpx>=0.26.0",
    # S-32: ai/providers.py guards this import, but WITHOUT the declaration
    # `generate_json` silently skipped schema validation while the caller
    # believed it ran. Declared so the guard can never fall through.
    "jsonschema>=4.20.0",
    "pydantic-settings>=2.0.3",
    "redis>=5.0.1",
    "arq>=0.25.0",
    "bcrypt>=4.1.1",
    "fastcrud>=0.19.2",
    "crudadmin>=0.4.2",
    "gunicorn>=23.0.0",
    # Dev tools moved to [project.optional-dependencies] dev section
    "jinja2>=3.1.0",
    "cryptography>=45.0.3",
    "structlog>=24.1.0",
    "aiosmtplib>=3.0.0",
    # "py_webauthn>=2.0.0",
    "authlib>=1.3.0",
    "webauthn>=2.0.0",
    # Storage & Observability (Phase 4/7)
    "azure-storage-blob>=12.0.0",
    # boto3 — AWS S3 backend (dxub.9 DECIDED: DECLARE).
    # S3 is a REACHABLE backend: "s3" is a member of the public
    # StorageProviderType enum that POST /storage accepts, and it is the
    # shipped OpenAPI example. Declaring azure-storage-blob above while
    # leaving its exact counterpart undeclared made the selectable backend
    # unrunnable on every clean install — a comment could not fix that, only
    # hide it. Keeping azure and s3 symmetric is what makes both honest.
    # Imported function-locally in clients/storage, so install cost is paid
    # only by deployments that never construct an S3 provider.
    "boto3>=1.35.0",
    "aiofiles>=23.0.0",
    "opentelemetry-api>=1.20.0",
    # Billing & AI (Phase 3/5)
    "stripe>=8.0.0",
    "ollama>=0.3.0",
    # Performance (Phase 2)
    "orjson>=3.9.0",
    # Unix-only async event loop (not available on Windows)
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "xxhash>=3.6.0",
    "bitarray>=3.8.0",
    "cachetools>=6.2.4",
    # Attack-scan prefilter (Aho-Corasick); pure-stdlib str.find fallback if absent
    "pyahocorasick>=2.0.0",
    # MFA (Phase 3)
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.0",
    # Multi-Provider AI (Phase 4)
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "filetype>=1.2.0",
    "pytest-timeout>=2.4.0",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.2",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
    "faker>=26.0.0",
    "mypy>=1.8.0",
    "types-redis>=4.6.0",
    "ruff>=0.1.0",
    "locust>=2.43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.hatch.build.targets.wheel]
include = ["src/"]
packages = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "F", # Pyflakes
    # https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
    "E", # pycodestyle
    "W", # Warning
    # https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    # https://docs.astral.sh/ruff/rules/#mccabe-c90
    "C", # Complexity (mccabe+) & comprehensions
    # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "UP", # pyupgrade
    # https://docs.astral.sh/ruff/rules/#isort-i
    "I", # isort
    # https://docs.astral.sh/ruff/rules/#flake8-tidy-imports-tid
    "TID", # tidy-imports (P1-20: enforces the package-root boundary below)
    # https://docs.astral.sh/ruff/rules/#flake8-blind-except-ble
    "BLE", # blind-except (P1-17: enforced on the boot path only; the
            # per-file-ignores below scope it until the repo-wide campaign)
]
ignore = [
    # https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
    "E402", # module level import not at top of file
    # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "UP006", # use-pep585-annotation
    "UP007", # use-pep604-annotation
    "E741",  # Ambiguous variable name
    # "UP035", # deprecated-assertion
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401", # unused import
    "F403", # star imports
]
"src/migrations/*" = ["E501"]
# P1-17: BLE001 is enforced on the boot path
# (src/app/main.py, src/app/core/setup.py, src/app/api/monitoring.py,
# src/app/core/job_monitoring.py). Everything else below is deferred to the
# repo-wide blind-except campaign — do NOT add new broad excepts there
# without a justification; extend enforcement instead.
#
# muse 22 (FastAPI_saas-io15.4) narrowed three more subtrees from a blanket
# glob to an explicit per-file list, so that `api/deps/auth.py`,
# `middleware/tenant.py` and `clients/notifications/smtp.py` are now
# ENFORCED rather than silently exempt. A glob like `middleware/**` cannot
# exempt its siblings and enforce one file: ruff UNIONs a broad
# per-file-ignore with a narrower one, so the exemption always wins. The
# list form is what makes the gate actually bite on the triaged files.
"src/app/{modules,admin,transport,models,schemas,shared,templates}/**" = ["BLE001"]
# Deferred siblings of the triaged files (still unannotated broad excepts,
# not yet triaged — each must carry a reasoned noqa or be narrowed later).
"src/app/middleware/{attack_detection,rate_limit}.py" = ["BLE001"]
"src/app/clients/storage/{azure_storage,local_storage,s3_storage}.py" = ["BLE001"]
# TID is merged in here because the api/v1 BLE001 entry must name the same
# glob (a second entry for one pattern is a duplicate-key TOML error).
"src/app/api/v1/**" = ["BLE001", "TID"]
"src/app/api/{__init__,openapi}.py" = ["BLE001"]
"src/app/{__init__,events}.py" = ["BLE001"]
"src/app/core/{cache,config,db,events,exceptions,monitoring,observability,rbac,resilience,security,tenancy,utils,worker}/**" = ["BLE001"]
"src/app/core/{__init__,env_validator,errors,health,json_utils,logger,middleware_exempt,pagination,redis_provider,schemas}.py" = ["BLE001"]
"src/{migrations,scripts}/**" = ["BLE001"]
"tests/**" = ["BLE001", "TID"]
# P1-20: TID (banned-api) per-file exemptions. The package-root rule
# applies to cross-module production imports; these are sanctioned:
# - api/v1/__init__.py is the composition root — it MUST import routers to mount them.
# - modules/*/__init__.py are the facades — deep imports inside lazy __getattr__ ARE the seam.
# (tests/** above: white-box tests pin internals + mock targets by design.)
"src/app/api/v1/__init__.py" = ["TID"]
"src/app/modules/*/__init__.py" = ["TID"]
# P1-20 (widened, 2026-09-30) — the exemptions that make the widened ban
# expressible. ruff cannot see WHO imports, so each entry below is a seam
# where a service/router is legitimately reached, and each is a class of
# site rather than a single file. Removing one turns the gate red.
# - modules/*/router.py + modules/*/routers/**: a module's own router
#   calling its own service. That is the module's internal layering.
# - modules/*/checkout_service.py etc. are NOT exempt: a service reaching
#   ANOTHER module's service is exactly the coupling this gate exists for.
"src/app/modules/*/router.py" = ["TID251"]
# auth is the one module whose service layer is a PACKAGE: `auth/service.py`
# and `auth/services/*` are siblings inside the same module, so the
# intra-module rule above (which matches only `router.py`/`routers/`) does
# not cover them. These are auth-internal edges, not cross-module coupling.
"src/app/modules/auth/service.py" = ["TID251"]
"src/app/modules/auth/services/**" = ["TID251"]
"src/app/modules/*/routers/**" = ["TID251"]
# Intra-module service/router edges that the wildcard above does not cover
# (the patterns only match files named `router.py`/`routers/`):
# - rbac/permissions_router.py is rbac's own second router, so it reaches
#   rbac.router and rbac.service; it is intra-module layering like router.py.
# - billing/checkout_service.py and audit_logs/trail.py are siblings of
#   their own module's service.py, not a cross-module consumer.
"src/app/modules/rbac/permissions_router.py" = ["TID251"]
"src/app/modules/billing/checkout_service.py" = ["TID251"]
"src/app/modules/audit_logs/trail.py" = ["TID251"]
# DELIBERATE cross-module exemptions — a module reaching ANOTHER module's
# service. These are the two residual breaches this gate reports today.
# Both are documented import-cycle guards, not drift: `tiers/__init__.py`
# states that `tiers.service` transitively imports `rate_limits`, so
# `users.service` and `rate_limits.service` import it directly and eagerly
# to keep the cycle out of the tiers-first import order. Rewriting them to
# the facade would reintroduce the ImportError that __getattr__ was added
# to prevent. They stay as named, visible debt — a NEW cross-module
# service import is still red.
"src/app/modules/users/service.py" = ["TID251"]
"src/app/modules/rate_limits/service.py" = ["TID251"]
# events.py registers handlers with the services that own them; worker.py
# is the worker's own composition root. Both are registries, not consumers.
"src/app/events.py" = ["TID251"]
"src/app/worker.py" = ["TID251"]
# api/deps/auth.py: the principal seam resolves an API key through
# api_keys.service by design (its docstring states the seam is deliberate).
"src/app/api/deps/auth.py" = ["TID251"]
# P2-13: env_validator.py is the sanctioned raw-environment reader (its
# contract is pre-Pydantic validation; tests pin os.environ patching).
# scripts/** are ops harnesses that read their own harness env directly.
"src/app/core/env_validator.py" = ["TID251"]
"scripts/**" = ["BLE001", "TID251"]

[tool.ruff.lint.mccabe]
max-complexity = 24

# Module boundary enforcement: ban internal cross-module imports
[tool.ruff.lint.flake8-tidy-imports.banned-api]
# P2-13: raw os.getenv is banned outside src/app/core/config/. The sanctioned
# exceptions are env_validator.py (pre-Pydantic raw-env validator) and
# scripts/** (ops harnesses); see per-file-ignores above.
"os.getenv".msg = "Use Pydantic settings (src.app.core.config) instead of raw os.getenv"
# P1-20 WIDENED + RE-FRAMED (2026-09-30). This list previously named 6 of
# the 160 internal cells and `ruff check --select TID251` was CLEAN — it
# caught nothing. The rule as written ("never import another module's
# internals", ARCHITECTURE.md:39) defends the BEHAVIOUR LAYER: a module's
# service and router are what the facade exists to hide. models/schemas/crud
# are not that seam; banning them would have demanded 429 rewrites of LEGAL
# intra-module imports (measured), not 40 targeted ones.
#
# The reframe is also the only expressible one: ruff banned-api is
# PREFIX-ONLY, has NO WILDCARDS, and has NO NOTION OF THE IMPORTER. Banning
# `src.app.modules.X` would ban the facade `src.app.modules.X` itself and
# would flag a module's own `router.py -> service.py` edge, which is that
# module's internal layering and is legal. The per-file-ignores that make
# this green are therefore structural, not cosmetic.
#
# Cells: every `{module}.service` and `{module}.router` (and their
# subpackages) enumerated from the tree - 40 cells across all 21 modules
# that have a service or router. `_base` is excluded: it is documented
# shared scaffolding, not a feature module.
# ai
"src.app.modules.ai.router".msg = 'Deep module import: use the package root `src.app.modules.ai` (its lazy __getattr__ facade) instead'
"src.app.modules.ai.service".msg = 'Deep module import: use the package root `src.app.modules.ai` (its lazy __getattr__ facade) instead'
# api_keys
"src.app.modules.api_keys.router".msg = 'Deep module import: use the package root `src.app.modules.api_keys` (its lazy __getattr__ facade) instead'
"src.app.modules.api_keys.service".msg = 'Deep module import: use the package root `src.app.modules.api_keys` (its lazy __getattr__ facade) instead'
# app_configuration
"src.app.modules.app_configuration.router".msg = 'Deep module import: use the package root `src.app.modules.app_configuration` (its lazy __getattr__ facade) instead'
"src.app.modules.app_configuration.service".msg = 'Deep module import: use the package root `src.app.modules.app_configuration` (its lazy __getattr__ facade) instead'
# audit_logs
"src.app.modules.audit_logs.router".msg = 'Deep module import: use the package root `src.app.modules.audit_logs` (its lazy __getattr__ facade) instead'
"src.app.modules.audit_logs.service".msg = 'Deep module import: use the package root `src.app.modules.audit_logs` (its lazy __getattr__ facade) instead'
# auth
"src.app.modules.auth.router".msg = 'Deep module import: use the package root `src.app.modules.auth` (its lazy __getattr__ facade) instead'
"src.app.modules.auth.service".msg = 'Deep module import: use the package root `src.app.modules.auth` (its lazy __getattr__ facade) instead'
# billing
"src.app.modules.billing.router".msg = 'Deep module import: use the package root `src.app.modules.billing` (its lazy __getattr__ facade) instead'
"src.app.modules.billing.service".msg = 'Deep module import: use the package root `src.app.modules.billing` (its lazy __getattr__ facade) instead'
# dashboard
"src.app.modules.dashboard.router".msg = 'Deep module import: use the package root `src.app.modules.dashboard` (its lazy __getattr__ facade) instead'
"src.app.modules.dashboard.service".msg = 'Deep module import: use the package root `src.app.modules.dashboard` (its lazy __getattr__ facade) instead'
# feature_flags
"src.app.modules.feature_flags.router".msg = 'Deep module import: use the package root `src.app.modules.feature_flags` (its lazy __getattr__ facade) instead'
"src.app.modules.feature_flags.service".msg = 'Deep module import: use the package root `src.app.modules.feature_flags` (its lazy __getattr__ facade) instead'
# health
"src.app.modules.health.router".msg = 'Deep module import: use the package root `src.app.modules.health` (its lazy __getattr__ facade) instead'
# notifications

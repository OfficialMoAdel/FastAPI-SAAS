[tool.ruff.lint.pydocstyle]
convention = "numpy"

# Coverage ratchet: unit suite measured 84.73% (Sep 2026). fail_under = 80
# leaves a buffer for refactors while failing the build on real backslides.
[tool.coverage.report]
fail_under = 80

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::PendingDeprecationWarning:starlette.formparsers",
    # Suppress RuntimeWarning for async mock issues in tests (fakeredis pipeline mocking)
    "ignore::RuntimeWarning",
    # Suppress FastCRUD schema_to_select deprecation warnings
    "ignore::DeprecationWarning:",
    # Suppress Pydantic class-based Config deprecation
    "ignore::DeprecationWarning:pydantic",
    # Suppress unknown pytest mark warnings
    "ignore::pytest.PytestUnknownMarkWarning",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Prevent the suite from hanging forever on a leaked task/connection.
# A true hang (never completes) will be killed and dump a traceback showing
# the exact blocking call. 300s is ~400x the per-test average, so it only
# fires on genuine hangs, not slow tests.
timeout = 300
timeout_method = "thread"
markers = [
    "e2e: marks tests as end-to-end tests (require full stack)",
    "uses_real_redis: marks tests that require a real Redis instance",
    "slow: marks tests as slow running",
    "benchmark: marks tests as performance benchmarks",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "faker>=37.3.0",
    # s92p.1: the layering gate is cited as an enforced invariant in
    # AGENTS.md/ARCHITECTURE.md, so it must be runnable BEFORE a push. It was
    # absent here and installed ad-hoc in CI, so a developer could only
    # discover a broken contract after pushing - the failure mode that let
    # the H-5 contract sit red unnoticed.
    "import-linter>=2.1",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.0",
    "pre-commit>=4.3.0",
    "pytest-asyncio==0.24.0", # 0.24.0 supports loop_scope; 0.25+ has event loop bugs
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "structlog>=25.5.0",
    "types-aiofiles>=25.1.0.20251011",
    "types-cachetools>=6.2.0.20251022",
    "ruff>=0.11.13",
    "mypy>=1.16.0",
    "locust>=2.43.0",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "."
namespace_packages = true
packages = ["src"]
check_untyped_defs = true
disallow_any_generics = false
# ignore_errors = true

[[tool.mypy.overrides]]
module = "src.app.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "src.app.core.*"
disallow_untyped_defs = true
ignore_errors = false

[project]
name = "fastapi-saas"
version = "0.1.0"
description = "Production-ready, modular FastAPI SaaS  with async support, multi-tenancy, and standardized patterns."
authors = [{ name = "SaaS Framework Maintainers", email = "maintainers@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11, <4"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic[email]>=2.6.1",
    "fastapi>=0.109.1",
    "uvicorn>=0.27.0",
    "httptools>=0.6.1",
    "uuid>=1.30",
    "uuid6>=2024.1.12",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "SQLAlchemy-Utils>=0.41.1",
    "PyJWT>=2.8.0",
    "SQLAlchemy>=2.0.25",
    "python-multipart>=0.0.9",
    "greenlet>=2.0.2",
    "httpx>=0.26.0",
    "pydantic-settings>=2.0.3",
    "redis>=5.0.1",
    "arq>=0.25.0",
    "bcrypt>=4.1.1",
    "psycopg2-binary>=2.9.9",
    "fastcrud>=0.19.2",
    "crudadmin>=0.4.2",
    "gunicorn>=23.0.0",
    "ruff>=0.11.13",
    "mypy>=1.16.0",
    "jinja2>=3.1.0",
    "cryptography>=45.0.3",
    "structlog>=24.1.0",
    "aiosmtplib>=3.0.0",
    # "py_webauthn>=2.0.0",
    "authlib>=1.3.0",
    "webauthn>=2.0.0",
    # Storage & Observability (Phase 4/7)
    "azure-storage-blob>=12.0.0",
    "aiofiles>=23.0.0",
    "opentelemetry-api>=1.20.0",
    # Billing & AI (Phase 3/5)
    "stripe>=8.0.0",
    "ollama>=0.3.0",
    "locust>=2.43.0",
    # Performance (Phase 2)
    "orjson>=3.9.0",
    # Unix-only async event loop (not available on Windows)
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "xxhash>=3.6.0",
    "bitarray>=3.8.0",
    "cachetools>=6.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.2",
    "pytest-mock>=3.14.0",
    "faker>=26.0.0",
    "mypy>=1.8.0",
    "types-redis>=4.6.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.hatch.build.targets.wheel]
include = ["src/"]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "F", # Pyflakes
    # https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
    "E", # pycodestyle
    "W", # Warning
    # https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    # https://docs.astral.sh/ruff/rules/#mccabe-c90
    "C", # Complexity (mccabe+) & comprehensions
    # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "UP", # pyupgrade
    # https://docs.astral.sh/ruff/rules/#isort-i
    "I", # isort
]
ignore = [
    # https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
    "E402", # module level import not at top of file
    # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "UP006", # use-pep585-annotation
    "UP007", # use-pep604-annotation
    "E741",  # Ambiguous variable name
    # "UP035", # deprecated-assertion
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401", # unused import
    "F403", # star imports
]

[tool.ruff.lint.mccabe]
max-complexity = 24

# Module boundary enforcement: ban internal cross-module imports
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"src.app.modules.auth.service".msg = "Import from 'src.app.modules.auth' instead of internal files"
"src.app.modules.auth.router".msg = "Import from 'src.app.modules.auth' instead of internal files"
"src.app.modules.users.service".msg = "Import from 'src.app.modules.users' instead of internal files"
"src.app.modules.users.router".msg = "Import from 'src.app.modules.users' instead of internal files"
"src.app.modules.tenants.service".msg = "Import from 'src.app.modules.tenants' instead of internal files"
"src.app.modules.posts.service".msg = "Import from 'src.app.modules.posts' instead of internal files"


[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::PendingDeprecationWarning:starlette.formparsers",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "faker>=37.3.0",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.0",
    "pre-commit>=4.3.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "structlog>=25.5.0",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "."
namespace_packages = true
packages = ["src"]
check_untyped_defs = false
disallow_any_generics = false
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.app.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "src.app.core.*"
disallow_untyped_defs = true
ignore_errors = false

services:
web:
    build:
      context: .
      dockerfile: Dockerfile
    # -------- Both of the following commands should be commented to run with nginx --------

    # -------- replace with comment to run with gunicorn --------
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # command: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000
    env_file:
      - ./src/.env
    environment:
      # Database pool sizing: pool_size = workers × 10
      # - 1 worker (uvicorn --reload): DB_POOL_SIZE=10 (default 20 is OK)
      # - 4 workers (gunicorn -w 4): DB_POOL_SIZE=40 (recommended)
      # - 8 workers: DB_POOL_SIZE=80
      # Total max connections = DB_POOL_SIZE + DB_MAX_OVERFLOW
      # Ensure PostgreSQL max_connections >= total_max_connections
      # DB_WORKERS: 1  # Set to match uvicorn --workers or gunicorn -w
      # DB_POOL_SIZE: 40  # Set to workers × 10
      # POSTGRES_MAX_CONNECTIONS: 100  # PostgreSQL max_connections in postgres.conf
    # -------- replace with expose if you are using nginx --------
    ports:
       - "8000:8000"
    # expose:
    #    - "8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./src/app:/code/app
      - ./src/.env:/code/.env

worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: arq app.core.worker.settings.WorkerSettings
    env_file:
      - ./src/.env
    environment:
      # ARQ worker scaling configuration
      # ARQ_WORKERS: Number of worker processes (default: 1, scale with `docker-compose up --scale worker=N`)
      # ARQ_MAX_JOBS: Max concurrent jobs per worker (default: 10, total capacity = ARQ_WORKERS × ARQ_MAX_JOBS)
      # ARQ_JOB_TIMEOUT: Default job timeout in seconds (default: 300s)
      # ARQ_MAX_TRIES: Retry failed jobs N times (default: 3)
      # ARQ_QUEUE_MAX_SIZE: Max queue size per priority (default: 10000, prevents memory issues)
      #
      # Scaling recommendations:
      # - Low load: 1 worker, ARQ_MAX_JOBS=10 (10 concurrent jobs)
      # - Medium load: 2-3 workers, ARQ_MAX_JOBS=10 (20-30 concurrent jobs)
      # - High load: 4-5 workers, ARQ_MAX_JOBS=10 (40-50 concurrent jobs)
      #
      # Ensure DB_POOL_SIZE >= (workers × ARQ_MAX_JOBS) + (web workers × 10)
      # ARQ_WORKERS: 1
      # ARQ_MAX_JOBS: 10
    environment:
      # ARQ Worker scaling recommendations:
      # - Low load: 1 worker (max_jobs=10)
      # - Medium load: 2-3 workers (each max_jobs=10)
      # - High load: 4-5 workers (each max_jobs=10)
      # Scale with: docker-compose up --scale worker=3
      # - Total concurrent jobs = workers × max_jobs
      # - Ensure DB_POOL_SIZE ≥ total concurrent jobs
      # ARQ_MAX_JOBS: 10  # Per-worker concurrency (default in settings.py)
    depends_on:
      - db
      - redis
    volumes:
      - ./src/app:/code/app
      - ./src/.env:/code/.env

  db:
    image: postgres:13
    env_file:
      - ./src/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    expose:
      - "6379"

  #-------- uncomment to run with nginx --------
  # nginx:
  #   image: nginx:latest
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./default.conf:/etc/nginx/conf.d/default.conf
  #   depends_on:
  #     - web

  #-------- uncomment to create first superuser --------
  create_superuser:
    build: 
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./src/.env
    depends_on:
      - db
      - web
    command: python -m src.scripts.create_first_superuser
    volumes:
      - ./src:/code/src

  #-------- uncomment to run tests --------
  pytest:
    build: 
      context: .
      dockerfile: Dockerfile 
    env_file:
      - ./src/.env
    depends_on:
      - db
      - create_superuser
      - redis
    command: python -m pytest ./tests
    volumes:
      - .:/code

  #-------- uncomment to create first tier --------
  # create_tier:
  #   build: 
  #     context: .
  #     dockerfile: Dockerfile
  #   env_file:
  #     - ./src/.env
  #   depends_on:
  #     - create_superuser
  #     - db
  #     - web
  #   command: python -m src.scripts.create_first_tier
  #   volumes:
  #     - ./src:/code/src

volumes:
  postgres-data:
  redis-data:
 

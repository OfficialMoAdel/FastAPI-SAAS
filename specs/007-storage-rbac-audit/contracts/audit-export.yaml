openapi: 3.1.0
info:
  title: Audit Logs Export API
  version: 1.0.0
  description: API for exporting audit logs

paths:
  /audit-logs/export:
    get:
      summary: Export audit logs
      description: Export audit logs as JSONL or CSV format with streaming response
      operationId: exportAuditLogs
      tags:
        - Audit Logs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [jsonl, csv]
            default: jsonl
          description: Export format
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter logs from this date (inclusive)
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter logs until this date (inclusive)
        - name: action
          in: query
          required: false
          schema:
            type: string
          description: Filter by action type
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by user ID
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
          description: Filter by entity type
      responses:
        '200':
          description: Streaming file download
          content:
            application/x-ndjson:
              schema:
                type: string
                description: JSONL format - one JSON object per line
            text/csv:
              schema:
                type: string
                description: CSV format with headers
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename
        '400':
          description: Export would exceed 100,000 records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportLimitError'
        '403':
          description: Missing AUDIT_LOGS_DOWNLOAD permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /audit-logs/export/count:
    get:
      summary: Preview export count
      description: Get count of records that would be exported without actually exporting
      operationId: previewExportCount
      tags:
        - Audit Logs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Record count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportCountResponse'
        '403':
          description: Missing AUDIT_LOGS_DOWNLOAD permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: integer
      description: Tenant ID for multi-tenancy

  schemas:
    ExportCountResponse:
      type: object
      properties:
        count:
          type: integer
          description: Number of records matching filters
        exceeds_limit:
          type: boolean
          description: Whether count exceeds 100,000 limit
        message:
          type: string
          description: Guidance if limit exceeded

    ExportLimitError:
      type: object
      properties:
        detail:
          type: string
          example: "Export would return 150,000 records. Maximum is 100,000. Please narrow your date range."
        count:
          type: integer
          description: Actual count of matching records
        limit:
          type: integer
          default: 100000

    Error:
      type: object
      properties:
        detail:
          type: string

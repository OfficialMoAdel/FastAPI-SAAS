openapi: 3.1.0
info:
  title: Files API
  version: 1.0.0
  description: API for file upload, download, and management

paths:
  /files/upload:
    post:
      summary: Upload a file
      description: Upload a file to tenant storage
      operationId: uploadFile
      tags:
        - Files
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload
                is_public:
                  type: boolean
                  default: false
                  description: Whether file should be publicly accessible
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRead'
        '400':
          description: Invalid file type or size exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '507':
          description: Storage quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /files:
    get:
      summary: List files
      description: List files for current tenant with pagination
      operationId: listFiles
      tags:
        - Files
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 1000
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: mime_type
          in: query
          schema:
            type: string
          description: Filter by MIME type prefix (e.g., "image/")
      responses:
        '200':
          description: List of files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListResponse'

  /files/{file_id}:
    get:
      summary: Download file
      description: Download file content with streaming response
      operationId: downloadFile
      tags:
        - Files
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update file metadata
      description: Update file visibility (public/private)
      operationId: updateFile
      tags:
        - Files
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUpdate'
      responses:
        '200':
          description: File updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRead'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete file
      description: Delete file from storage and database
      operationId: deleteFile
      tags:
        - Files
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FileId'
      responses:
        '204':
          description: File deleted successfully
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /files/{file_id}/info:
    get:
      summary: Get file metadata
      description: Get file metadata without downloading content
      operationId: getFileInfo
      tags:
        - Files
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: File metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRead'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /files/{file_id}/url:
    get:
      summary: Get signed URL
      description: Get a signed URL for public file access (requires is_public=true)
      operationId: getSignedUrl
      tags:
        - Files
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FileId'
        - name: expires_in
          in: query
          schema:
            type: integer
            default: 3600
            maximum: 86400
          description: URL expiration in seconds (default 1 hour, max 24 hours)
      responses:
        '200':
          description: Signed URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedUrlResponse'
        '400':
          description: File is not public
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: integer
      description: Tenant ID for multi-tenancy

    FileId:
      name: file_id
      in: path
      required: true
      schema:
        type: integer
      description: File ID

  schemas:
    FileRead:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        tenant_id:
          type: integer
        filename:
          type: string
          description: UUID-based unique filename
        original_filename:
          type: string
          description: Original uploaded filename
        mime_type:
          type: string
        file_size:
          type: integer
          format: int64
          description: Size in bytes
        storage_provider:
          type: string
          enum: [s3, azure, local]
        is_public:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true

    FileUpdate:
      type: object
      properties:
        is_public:
          type: boolean

    FileListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileRead'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    SignedUrlResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Signed URL for file access
        expires_at:
          type: string
          format: date-time
          description: URL expiration timestamp

    Error:
      type: object
      properties:
        detail:
          type: string

openapi: 3.1.0
info:
  title: Storage Settings API
  version: 1.0.0
  description: API for managing tenant storage provider configuration

paths:
  /storage/settings:
    get:
      summary: Get storage settings
      description: Retrieve storage settings for the current tenant
      operationId: getStorageSettings
      tags:
        - Storage Settings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Storage settings retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageSettingsRead'
        '404':
          description: Storage settings not found for tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create storage settings
      description: Create storage settings for the current tenant
      operationId: createStorageSettings
      tags:
        - Storage Settings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageSettingsCreate'
      responses:
        '201':
          description: Storage settings created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageSettingsRead'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing MANAGE_STORAGE_SETTINGS permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Storage settings already exist for tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update storage settings
      description: Update storage settings for the current tenant
      operationId: updateStorageSettings
      tags:
        - Storage Settings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageSettingsUpdate'
      responses:
        '200':
          description: Storage settings updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageSettingsRead'
        '403':
          description: Missing MANAGE_STORAGE_SETTINGS permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Storage settings not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: integer
      description: Tenant ID for multi-tenancy

  schemas:
    StorageProvider:
      type: string
      enum: [s3, azure, local]
      description: Storage provider type

    StorageSettingsCreate:
      type: object
      required:
        - provider
      properties:
        provider:
          $ref: '#/components/schemas/StorageProvider'
        s3_bucket_name:
          type: string
          maxLength: 255
        s3_region:
          type: string
          maxLength: 50
        s3_access_key_id:
          type: string
          maxLength: 255
          description: Will be encrypted before storage
        s3_secret_access_key:
          type: string
          maxLength: 255
          description: Will be encrypted before storage
        azure_container_name:
          type: string
          maxLength: 255
        azure_connection_string:
          type: string
          description: Will be encrypted before storage
        local_storage_path:
          type: string
          maxLength: 500
        max_file_size_mb:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        allowed_file_types:
          type: array
          items:
            type: string
          default: ["image/*", "application/pdf"]
        max_file_count:
          type: integer
          minimum: 1
          default: 10000
        storage_quota_bytes:
          type: integer
          format: int64
          minimum: 1
          default: 10737418240

    StorageSettingsRead:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        provider:
          $ref: '#/components/schemas/StorageProvider'
        s3_bucket_name:
          type: string
          nullable: true
        s3_region:
          type: string
          nullable: true
        s3_access_key_id:
          type: string
          description: Masked (shows only last 4 characters)
          nullable: true
        azure_container_name:
          type: string
          nullable: true
        local_storage_path:
          type: string
          nullable: true
        max_file_size_mb:
          type: integer
        allowed_file_types:
          type: array
          items:
            type: string
        max_file_count:
          type: integer
        storage_quota_bytes:
          type: integer
          format: int64
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true

    StorageSettingsUpdate:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/StorageProvider'
        s3_bucket_name:
          type: string
        s3_region:
          type: string
        s3_access_key_id:
          type: string
        s3_secret_access_key:
          type: string
        azure_container_name:
          type: string
        azure_connection_string:
          type: string
        local_storage_path:
          type: string
        max_file_size_mb:
          type: integer
        allowed_file_types:
          type: array
          items:
            type: string
        max_file_count:
          type: integer
        storage_quota_bytes:
          type: integer
          format: int64
        is_active:
          type: boolean

    Error:
      type: object
      properties:
        detail:
          type: string

openapi: 3.0.3
info:
  title: Feature Flags API
  description: |
    API for managing tenant-level feature flags in the multi-tenant FastAPI SaaS platform.
    
    **Feature Flags System:**
    - Tenant-level feature toggles stored in JSONB column
    - Fast lookup without JOINs
    - Flexible schema (boolean, integer, string values)
    - Real-time updates
    - Admin-only write access
    
    **Common Use Cases:**
    - Enable/disable features per tenant
    - Gradual feature rollout
    - A/B testing
    - Usage limits (max_users, webhook_limit, etc.)
    - Tiered feature access
    
    **Flag Types:**
    - Boolean: Simple on/off flags
    - Integer: Numeric limits or quotas
    - String: Configuration values
    - Nested: Complex configurations
    
  version: 1.0.0
  contact:
    name: FastAPI SaaS Support
    email: support@example.com

servers:
  - url: https://api.example.com/api/v1
    description: Production
  - url: http://localhost:8000/api/v1
    description: Development

security:
  - BearerAuth: []

tags:
  - name: Feature Flags
    description: Manage tenant feature flags

paths:
  /feature-flags:
    get:
      summary: Get all feature flags
      description: |
        Retrieve all feature flags for the current tenant.
        
        **Permissions Required:** `feature_flags.read` (tenant users) OR `admin` (all flags)
        
        **Returns:**
        - All configured flags for tenant
        - Default values for unconfigured flags
        - Flag metadata (type, description)
      tags:
        - Feature Flags
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - name: include_defaults
          in: query
          description: Include default values for unconfigured flags
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Feature flags retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  flags:
                    type: object
                    description: Feature flag key-value pairs
                    additionalProperties: true
                  metadata:
                    type: object
                    description: Flag metadata
                    additionalProperties:
                      $ref: '#/components/schemas/FeatureFlagMetadata'
              example:
                flags:
                  advanced_analytics: true
                  api_access: false
                  custom_branding: true
                  webhook_limit: 10
                  email_templates: true
                  audit_log_retention_days: 90
                  max_users: 100
                  max_storage_gb: 50
                metadata:
                  advanced_analytics:
                    type: "boolean"
                    description: "Enable advanced analytics dashboard"
                    default: false
                  api_access:
                    type: "boolean"
                    description: "Enable API access"
                    default: false
                  webhook_limit:
                    type: "integer"
                    description: "Maximum number of webhook endpoints"
                    default: 5
                    min: 0
                    max: 100
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /feature-flags/{flag_name}:
    get:
      summary: Check if feature is enabled
      description: |
        Check if a specific feature flag is enabled for the current tenant.
        
        **Permissions Required:** `feature_flags.read`
        
        **Logic:**
        1. Check tenant's feature_flags JSONB
        2. If flag not set, return default value
        3. For boolean flags, return true/false
        4. For numeric flags, return current value
      tags:
        - Feature Flags
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - name: flag_name
          in: path
          required: true
          description: Feature flag name
          schema:
            type: string
            example: "advanced_analytics"
      responses:
        '200':
          description: Feature flag status
          content:
            application/json:
              schema:
                type: object
                required:
                  - flag_name
                  - enabled
                  - value
                properties:
                  flag_name:
                    type: string
                    example: "advanced_analytics"
                  enabled:
                    type: boolean
                    description: For boolean flags, the flag value. For numeric/string flags, true if value exists.
                    example: true
                  value:
                    description: Actual flag value (type varies)
                    oneOf:
                      - type: boolean
                      - type: integer
                      - type: string
                      - type: object
                    example: true
                  type:
                    type: string
                    enum: [boolean, integer, string, object]
                    example: "boolean"
                  default:
                    type: boolean
                    description: Whether this is the default value
                    example: false
              examples:
                booleanFlag:
                  summary: Boolean flag (enabled)
                  value:
                    flag_name: "advanced_analytics"
                    enabled: true
                    value: true
                    type: "boolean"
                    default: false
                integerFlag:
                  summary: Integer flag (quota)
                  value:
                    flag_name: "webhook_limit"
                    enabled: true
                    value: 10
                    type: "integer"
                    default: false
                disabledFlag:
                  summary: Disabled flag (default)
                  value:
                    flag_name: "api_access"
                    enabled: false
                    value: false
                    type: "boolean"
                    default: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Feature flag not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "FLAG_NOT_FOUND"
                message: "Feature flag 'invalid_flag' does not exist"
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      summary: Update feature flag
      description: |
        Update a feature flag value for the current tenant.
        
        **Permissions Required:** `admin` OR `feature_flags.write` (admin only)
        
        **Notes:**
        - Only admins can update flags
        - Validation enforced for known flags
        - Invalid values rejected
        - Audit logged automatically
      tags:
        - Feature Flags
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - name: flag_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeatureFlagRequest'
            examples:
              enableFeature:
                summary: Enable boolean flag
                value:
                  value: true
              setQuota:
                summary: Set numeric quota
                value:
                  value: 20
              disableFeature:
                summary: Disable feature
                value:
                  value: false
      responses:
        '200':
          description: Feature flag updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  flag_name:
                    type: string
                  value:
                    description: Updated value
                  previous_value:
                    description: Previous value
                  message:
                    type: string
              example:
                flag_name: "webhook_limit"
                value: 20
                previous_value: 10
                message: "Feature flag updated successfully"
        '400':
          description: Invalid flag value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidType:
                  value:
                    error: "VALIDATION_ERROR"
                    message: "Flag 'webhook_limit' expects integer, got string"
                outOfRange:
                  value:
                    error: "VALIDATION_ERROR"
                    message: "Value 200 exceeds maximum of 100 for 'webhook_limit'"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Insufficient permissions (admin required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "FORBIDDEN"
                message: "Only administrators can update feature flags"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Reset feature flag to default
      description: |
        Remove custom flag value and revert to default.
        
        **Permissions Required:** `admin`
        
        **Effect:**
        - Removes flag from tenant's feature_flags JSONB
        - Flag will use system default value
        - Audit logged automatically
      tags:
        - Feature Flags
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - name: flag_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Feature flag reset to default
          content:
            application/json:
              schema:
                type: object
                properties:
                  flag_name:
                    type: string
                  default_value:
                    description: Default value now in effect
                  message:
                    type: string
              example:
                flag_name: "webhook_limit"
                default_value: 5
                message: "Feature flag reset to default value"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /feature-flags/bulk:
    patch:
      summary: Bulk update feature flags
      description: |
        Update multiple feature flags in a single request.
        
        **Permissions Required:** `admin`
        
        **Use Cases:**
        - Tier upgrades/downgrades
        - Onboarding configurations
        - Bulk tenant management
        
        **Notes:**
        - All updates are atomic (all succeed or all fail)
        - Validation applied to all flags before update
        - Single audit log entry created for bulk update
      tags:
        - Feature Flags
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - flags
              properties:
                flags:
                  type: object
                  description: Flag name to value mapping
                  additionalProperties: true
            examples:
              tierUpgrade:
                summary: Upgrade to premium tier
                value:
                  flags:
                    advanced_analytics: true
                    api_access: true
                    webhook_limit: 20
                    max_users: 500
                    custom_branding: true
              tierDowngrade:
                summary: Downgrade to basic tier
                value:
                  flags:
                    advanced_analytics: false
                    api_access: false
                    webhook_limit: 5
                    max_users: 50
                    custom_branding: false
      responses:
        '200':
          description: Flags updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: array
                    items:
                      type: object
                      properties:
                        flag_name:
                          type: string
                        old_value:
                          description: Previous value
                        new_value:
                          description: New value
                  message:
                    type: string
              example:
                updated:
                  - flag_name: "advanced_analytics"
                    old_value: false
                    new_value: true
                  - flag_name: "webhook_limit"
                    old_value: 5
                    new_value: 20
                message: "2 feature flags updated successfully"
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "VALIDATION_ERROR"
                message: "Validation failed for flags: webhook_limit (exceeds max)"
                details:
                  failed_flags:
                    - flag_name: "webhook_limit"
                      error: "Value 200 exceeds maximum of 100"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /feature-flags/available:
    get:
      summary: List available feature flags
      description: |
        Get all available feature flags in the system with metadata.
        
        **Permissions Required:** `feature_flags.read`
        
        **Returns:**
        - All defined feature flags
        - Type, description, default value
        - Validation rules (min, max, allowed values)
      tags:
        - Feature Flags
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
            enum: [access, limits, features, billing]
      responses:
        '200':
          description: Available feature flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  flags:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeatureFlagDefinition'
              example:
                flags:
                  - name: "advanced_analytics"
                    type: "boolean"
                    category: "features"
                    description: "Enable advanced analytics dashboard"
                    default: false
                  - name: "api_access"
                    type: "boolean"
                    category: "access"
                    description: "Enable REST API access"
                    default: false
                  - name: "webhook_limit"
                    type: "integer"
                    category: "limits"
                    description: "Maximum number of webhook endpoints"
                    default: 5
                    validation:
                      min: 0
                      max: 100
                  - name: "max_users"
                    type: "integer"
                    category: "limits"
                    description: "Maximum number of users per tenant"
                    default: 10
                    validation:
                      min: 1
                      max: 10000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    XTenantID:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string

  schemas:
    UpdateFeatureFlagRequest:
      type: object
      required:
        - value
      properties:
        value:
          description: New flag value (type must match flag definition)
          oneOf:
            - type: boolean
            - type: integer
            - type: string
            - type: object
          example: true

    FeatureFlagMetadata:
      type: object
      properties:
        type:
          type: string
          enum: [boolean, integer, string, object]
          example: "boolean"
        description:
          type: string
          example: "Enable advanced analytics dashboard"
        default:
          description: Default value
          example: false
        min:
          type: integer
          description: Minimum value (for integer flags)
          example: 0
        max:
          type: integer
          description: Maximum value (for integer flags)
          example: 100
        allowed_values:
          type: array
          description: Allowed values (for string flags)
          items:
            type: string

    FeatureFlagDefinition:
      type: object
      required:
        - name
        - type
        - description
        - default
      properties:
        name:
          type: string
          example: "advanced_analytics"
        type:
          type: string
          enum: [boolean, integer, string, object]
          example: "boolean"
        category:
          type: string
          enum: [access, limits, features, billing, other]
          example: "features"
        description:
          type: string
          example: "Enable advanced analytics dashboard"
        default:
          description: Default value
          example: false
        validation:
          type: object
          description: Validation rules
          properties:
            min:
              type: integer
            max:
              type: integer
            allowed_values:
              type: array
              items:
                type: string
            pattern:
              type: string
              description: Regex pattern for string validation

    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

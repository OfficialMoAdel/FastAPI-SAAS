openapi: 3.1.0
info:
  title: AI Features API
  description: API for AI chat sessions, messages, and user preferences
  version: 1.0.0

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Chat Sessions
    description: AI chat session management
  - name: Messages
    description: Chat message operations
  - name: AI Settings
    description: User AI preferences

paths:
  # ============================================
  # CHAT SESSIONS
  # ============================================
  /ai/sessions:
    get:
      tags: [Chat Sessions]
      summary: List user's chat sessions
      operationId: listChatSessions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated list of chat sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionPage'

    post:
      tags: [Chat Sessions]
      summary: Create new chat session
      operationId: createChatSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSessionCreate'
      responses:
        '201':
          description: Chat session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionRead'

  /ai/sessions/{session_id}:
    get:
      tags: [Chat Sessions]
      summary: Get chat session with messages
      operationId: getChatSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Chat session with message history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionWithMessages'
        '404':
          description: Session not found

    patch:
      tags: [Chat Sessions]
      summary: Update chat session
      operationId: updateChatSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSessionUpdate'
      responses:
        '200':
          description: Chat session updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionRead'
        '404':
          description: Session not found

    delete:
      tags: [Chat Sessions]
      summary: Delete chat session
      operationId: deleteChatSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/SessionID'
      responses:
        '204':
          description: Session deleted
        '404':
          description: Session not found

  # ============================================
  # MESSAGES
  # ============================================
  /ai/sessions/{session_id}/messages:
    get:
      tags: [Messages]
      summary: Get messages for session
      operationId: getSessionMessages
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/SessionID'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Paginated message history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessagePage'
        '404':
          description: Session not found

    post:
      tags: [Messages]
      summary: Send message and get AI response
      operationId: sendMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageCreate'
      responses:
        '200':
          description: AI response generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessagePair'
        '404':
          description: Session not found
        '429':
          description: Rate limit exceeded (60 requests/minute/user)
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until rate limit resets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '503':
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIServiceError'

  # ============================================
  # AI SETTINGS
  # ============================================
  /ai/settings:
    get:
      tags: [AI Settings]
      summary: Get current user's AI settings
      operationId: getAISettings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      responses:
        '200':
          description: AI settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISettingsRead'
        '404':
          description: Settings not configured (use defaults)

    put:
      tags: [AI Settings]
      summary: Update AI settings
      operationId: updateAISettings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AISettingsUpdate'
      responses:
        '200':
          description: AI settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISettingsRead'

  /ai/models:
    get:
      tags: [AI Settings]
      summary: List available AI models
      operationId: listAIModels
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      responses:
        '200':
          description: List of available models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AIModel'
        '503':
          description: AI service unavailable

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    XTenantID:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: integer
      description: Tenant identifier

    SessionID:
      name: session_id
      in: path
      required: true
      schema:
        type: integer
      description: Chat session ID

  schemas:
    # ============================================
    # CHAT SESSIONS
    # ============================================
    ChatSessionCreate:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          nullable: true
        model:
          type: string
          maxLength: 50
          default: gemma3

    ChatSessionUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          nullable: true
        model:
          type: string
          maxLength: 50

    ChatSessionRead:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
          nullable: true
        model:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: [id, user_id, model, created_at]

    ChatSessionWithMessages:
      allOf:
        - $ref: '#/components/schemas/ChatSessionRead'
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/ChatMessageRead'
          required: [messages]

    ChatSessionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatSessionRead'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        pages:
          type: integer
      required: [items, total, page, limit, pages]

    # ============================================
    # CHAT MESSAGES
    # ============================================
    ChatMessageCreate:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 32000
      required: [content]

    ChatMessageRead:
      type: object
      properties:
        id:
          type: integer
        session_id:
          type: integer
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        token_count:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
      required: [id, session_id, role, content, created_at]

    ChatMessagePair:
      type: object
      properties:
        user_message:
          $ref: '#/components/schemas/ChatMessageRead'
        assistant_message:
          $ref: '#/components/schemas/ChatMessageRead'
      required: [user_message, assistant_message]

    ChatMessagePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessageRead'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        pages:
          type: integer
      required: [items, total, page, limit, pages]

    # ============================================
    # AI SETTINGS
    # ============================================
    AISettingsUpdate:
      type: object
      properties:
        model:
          type: string
          maxLength: 50
        temperature:
          type: number
          format: float
          minimum: 0.0
          maximum: 2.0
        max_tokens:
          type: integer
          minimum: 1
          maximum: 32000
        system_prompt:
          type: string
          nullable: true
          maxLength: 10000

    AISettingsRead:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        model:
          type: string
        temperature:
          type: number
          format: float
        max_tokens:
          type: integer
        system_prompt:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: [id, user_id, model, temperature, max_tokens, created_at]

    # ============================================
    # AI MODELS
    # ============================================
    AIModel:
      type: object
      properties:
        id:
          type: string
          description: Model identifier (e.g., 'gemma3', 'llama3')
        name:
          type: string
          description: Display name
        description:
          type: string
          nullable: true
        context_window:
          type: integer
          description: Maximum context window size
      required: [id, name, context_window]

    # ============================================
    # ERRORS
    # ============================================
    AIServiceError:
      type: object
      properties:
        detail:
          type: string
          description: Error message
        retry_after:
          type: integer
          nullable: true
          description: Suggested retry delay in seconds
      required: [detail]

    RateLimitError:
      type: object
      properties:
        detail:
          type: string
          description: Rate limit exceeded message
        retry_after:
          type: integer
          description: Seconds until rate limit resets
      required: [detail, retry_after]

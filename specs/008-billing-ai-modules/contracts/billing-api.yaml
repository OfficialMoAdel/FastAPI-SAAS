openapi: 3.1.0
info:
  title: Billing & Payments API
  description: API for subscription management, payment processing, and billing operations
  version: 1.0.0

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Stripe Settings
    description: Tenant Stripe configuration management
  - name: Subscription Plans
    description: Subscription plan CRUD operations
  - name: Products
    description: Product and pricing management
  - name: Subscriptions
    description: User subscription operations
  - name: Billing
    description: Billing records and checkout
  - name: Webhooks
    description: Stripe webhook handling

paths:
  # ============================================
  # STRIPE SETTINGS
  # ============================================
  /billing/stripe-settings:
    get:
      tags: [Stripe Settings]
      summary: Get Stripe settings for current tenant
      operationId: getStripeSettings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      responses:
        '200':
          description: Stripe settings retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StripeSettingsRead'
        '404':
          description: Stripe settings not configured

    put:
      tags: [Stripe Settings]
      summary: Update Stripe settings
      operationId: updateStripeSettings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StripeSettingsUpdate'
      responses:
        '200':
          description: Stripe settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StripeSettingsRead'
        '403':
          description: Missing MANAGE_BILLING permission

  # ============================================
  # SUBSCRIPTION PLANS
  # ============================================
  /billing/plans:
    get:
      tags: [Subscription Plans]
      summary: List subscription plans
      operationId: listSubscriptionPlans
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - name: active_only
          in: query
          schema:
            type: boolean
            default: true
          description: Filter to active plans only
      responses:
        '200':
          description: List of subscription plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionPlanRead'

    post:
      tags: [Subscription Plans]
      summary: Create subscription plan
      operationId: createSubscriptionPlan
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionPlanCreate'
      responses:
        '201':
          description: Subscription plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlanRead'
        '403':
          description: Missing MANAGE_PRODUCTS_AND_PRICING permission

  /billing/plans/{plan_id}:
    get:
      tags: [Subscription Plans]
      summary: Get subscription plan by ID
      operationId: getSubscriptionPlan
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/PlanID'
      responses:
        '200':
          description: Subscription plan details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlanRead'
        '404':
          description: Plan not found

    patch:
      tags: [Subscription Plans]
      summary: Update subscription plan
      operationId: updateSubscriptionPlan
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/PlanID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionPlanUpdate'
      responses:
        '200':
          description: Subscription plan updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlanRead'
        '403':
          description: Missing MANAGE_PRODUCTS_AND_PRICING permission
        '404':
          description: Plan not found

  /billing/plans/{plan_id}/deactivate:
    post:
      tags: [Subscription Plans]
      summary: Deactivate subscription plan
      operationId: deactivateSubscriptionPlan
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/PlanID'
      responses:
        '200':
          description: Plan deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlanRead'
        '403':
          description: Missing MANAGE_PRODUCTS_AND_PRICING permission

  # ============================================
  # PRODUCTS & PRICING
  # ============================================
  /billing/products:
    get:
      tags: [Products]
      summary: List products
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - name: active_only
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: List of products with pricing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductRead'

    post:
      tags: [Products]
      summary: Create product
      operationId: createProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRead'
        '403':
          description: Missing MANAGE_PRODUCTS_AND_PRICING permission

  /billing/products/{product_id}:
    get:
      tags: [Products]
      summary: Get product by ID
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/ProductID'
      responses:
        '200':
          description: Product details with pricing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRead'
        '404':
          description: Product not found

    patch:
      tags: [Products]
      summary: Update product
      operationId: updateProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/ProductID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRead'

  /billing/products/{product_id}/pricing:
    post:
      tags: [Products]
      summary: Add pricing tier to product
      operationId: addPricingTier
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - $ref: '#/components/parameters/ProductID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingCreate'
      responses:
        '201':
          description: Pricing tier added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingRead'

  # ============================================
  # USER SUBSCRIPTIONS
  # ============================================
  /billing/subscriptions/me:
    get:
      tags: [Subscriptions]
      summary: Get current user's subscription
      operationId: getMySubscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      responses:
        '200':
          description: Current subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSubscriptionRead'
        '404':
          description: No active subscription

  /billing/subscriptions/me/cancel:
    post:
      tags: [Subscriptions]
      summary: Cancel current subscription
      operationId: cancelMySubscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      responses:
        '200':
          description: Subscription cancellation scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSubscriptionRead'
        '404':
          description: No active subscription

  # ============================================
  # CHECKOUT & BILLING RECORDS
  # ============================================
  /billing/checkout:
    post:
      tags: [Billing]
      summary: Create checkout session
      operationId: createCheckoutSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutCreate'
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        '402':
          description: Payment failed (card declined, insufficient funds, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentError'

  /billing/history:
    get:
      tags: [Billing]
      summary: Get billing history for current user
      operationId: getBillingHistory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantID'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated billing history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingHistoryPage'

  # ============================================
  # WEBHOOKS
  # ============================================
  /billing/webhooks/stripe:
    post:
      tags: [Webhooks]
      summary: Handle Stripe webhook events
      operationId: handleStripeWebhook
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
        '400':
          description: Invalid signature

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    XTenantID:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: integer
      description: Tenant identifier

    PlanID:
      name: plan_id
      in: path
      required: true
      schema:
        type: integer
      description: Subscription plan ID

    ProductID:
      name: product_id
      in: path
      required: true
      schema:
        type: integer
      description: Product ID

  schemas:
    # ============================================
    # STRIPE SETTINGS
    # ============================================
    StripeSettingsRead:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        stripe_customer_id:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required: [id, tenant_id, is_active, created_at]

    StripeSettingsUpdate:
      type: object
      properties:
        stripe_customer_id:
          type: string
        webhook_secret:
          type: string
        is_active:
          type: boolean

    # ============================================
    # SUBSCRIPTION PLANS
    # ============================================
    SubscriptionPlanCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
        price_monthly_cents:
          type: integer
          minimum: 1
        price_yearly_cents:
          type: integer
          minimum: 1
        currency:
          type: string
          default: usd
          pattern: '^[a-z]{3}$'
        features:
          type: array
          items:
            type: string
          default: []
        sort_order:
          type: integer
          default: 0
        is_popular:
          type: boolean
          default: false
      required: [name, price_monthly_cents, price_yearly_cents]

    SubscriptionPlanUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
        price_monthly_cents:
          type: integer
          minimum: 1
        price_yearly_cents:
          type: integer
          minimum: 1
        features:
          type: array
          items:
            type: string
        sort_order:
          type: integer
        is_popular:
          type: boolean
        is_active:
          type: boolean

    SubscriptionPlanRead:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        price_monthly_cents:
          type: integer
        price_yearly_cents:
          type: integer
        currency:
          type: string
        features:
          type: array
          items:
            type: string
        sort_order:
          type: integer
        is_popular:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
      required: [id, tenant_id, name, price_monthly_cents, price_yearly_cents, currency, features, sort_order, is_popular, is_active, created_at]

    # ============================================
    # PRODUCTS & PRICING
    # ============================================
    ProductCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
      required: [name]

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
        is_active:
          type: boolean

    ProductRead:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
        pricing_tiers:
          type: array
          items:
            $ref: '#/components/schemas/PricingRead'
        created_at:
          type: string
          format: date-time
      required: [id, tenant_id, name, is_active, pricing_tiers, created_at]

    PricingCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        amount_cents:
          type: integer
          minimum: 0
        currency:
          type: string
          default: usd
        interval:
          type: string
          enum: [monthly, yearly, one_time]
        features:
          type: array
          items:
            type: string
          default: []
      required: [name, amount_cents, interval]

    PricingRead:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        name:
          type: string
        amount_cents:
          type: integer
        currency:
          type: string
        interval:
          type: string
          enum: [monthly, yearly, one_time]
        features:
          type: array
          items:
            type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required: [id, product_id, name, amount_cents, currency, interval, features, is_active, created_at]

    # ============================================
    # USER SUBSCRIPTIONS
    # ============================================
    UserSubscriptionRead:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        subscription_plan:
          $ref: '#/components/schemas/SubscriptionPlanRead'
        status:
          type: string
          enum: [active, canceled, past_due, expired, trialing]
        billing_interval:
          type: string
          enum: [monthly, yearly]
        current_period_start:
          type: string
          format: date-time
        current_period_end:
          type: string
          format: date-time
        cancel_at_period_end:
          type: boolean
        canceled_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required: [id, user_id, subscription_plan, status, billing_interval, current_period_start, current_period_end, cancel_at_period_end, created_at]

    # ============================================
    # CHECKOUT & BILLING
    # ============================================
    CheckoutCreate:
      type: object
      properties:
        plan_id:
          type: integer
        billing_interval:
          type: string
          enum: [monthly, yearly]
        success_url:
          type: string
          format: uri
        cancel_url:
          type: string
          format: uri
      required: [plan_id, billing_interval, success_url, cancel_url]

    CheckoutSession:
      type: object
      properties:
        checkout_url:
          type: string
          format: uri
        session_id:
          type: string
        expires_at:
          type: string
          format: date-time
          description: Session expiration (24 hours from creation)
      required: [checkout_url, session_id, expires_at]

    BillingRecordRead:
      type: object
      properties:
        id:
          type: integer
        amount_cents:
          type: integer
        currency:
          type: string
        status:
          type: string
          enum: [succeeded, failed, pending, refunded]
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required: [id, amount_cents, currency, status, created_at]

    BillingHistoryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BillingRecordRead'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        pages:
          type: integer
      required: [items, total, page, limit, pages]

    # ============================================
    # ERRORS
    # ============================================
    PaymentError:
      type: object
      properties:
        detail:
          type: string
          description: Payment error message
        error_code:
          type: string
          description: Stripe error code (e.g., card_declined, insufficient_funds)
        decline_code:
          type: string
          nullable: true
          description: Stripe decline code when applicable
      required: [detail, error_code]

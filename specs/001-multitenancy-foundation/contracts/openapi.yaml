openapi: 3.1.0
info:
  title: Multi-tenancy Foundation API
  description: Tenant management endpoints for Phase 1 multi-tenancy foundation
  version: 1.0.0

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Tenants
    description: Tenant CRUD operations (requires authentication)

paths:
  /tenants:
    get:
      tags: [Tenants]
      summary: List all tenants
      description: Returns a paginated list of all tenants. Requires authentication.
      operationId: listTenants
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: items_per_page
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: is_active
          in: query
          description: Filter by active status
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated list of tenants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Tenants]
      summary: Create a new tenant
      description: Creates a new tenant with the given name and slug. Requires authentication.
      operationId: createTenant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
      responses:
        '201':
          description: Tenant created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Tenant with this slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tenants/{tenant_id}:
    get:
      tags: [Tenants]
      summary: Get tenant by ID
      description: Returns a single tenant by its ID. Requires authentication.
      operationId: getTenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Tenants]
      summary: Update tenant
      description: Updates tenant name and/or active status. Requires authentication.
      operationId: updateTenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdate'
      responses:
        '200':
          description: Tenant updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tenants/{tenant_id}/deactivate:
    post:
      tags: [Tenants]
      summary: Deactivate tenant
      description: Sets tenant is_active to false. Requires authentication.
      operationId: deactivateTenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Tenant deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tenants/{tenant_id}/reactivate:
    post:
      tags: [Tenants]
      summary: Reactivate tenant
      description: Sets tenant is_active to true. Requires authentication.
      operationId: reactivateTenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Tenant reactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      description: Tenant ID
      schema:
        type: integer

  schemas:
    TenantCreate:
      type: object
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Display name for the tenant
          example: "Acme Corporation"
        slug:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
          description: URL-safe identifier for X-Tenant-ID header
          example: "acme-corp"

    TenantUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Updated display name
        is_active:
          type: boolean
          description: Active status (use /deactivate or /reactivate endpoints instead)

    TenantResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Acme Corporation"
        slug:
          type: string
          example: "acme-corp"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true

    TenantListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TenantResponse'
        total:
          type: integer
          example: 42
        page:
          type: integer
          example: 1
        items_per_page:
          type: integer
          example: 10

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          example: "Tenant with slug 'acme-corp' already exists"

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

site_name: FastAPI SaaS 
site_description: A production-ready, modular FastAPI starter with async support, multi-tenancy, and standardized base patterns.
site_author: Maintainers
site_url: https://github.com/OfficialMoAdel/FastAPI_SAAS

theme:
  name: material
  font:
    text: Ubuntu
  # logo: assets/logo.png
  # favicon: assets/favicon.png
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tabs
    - navigation.indexes
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - navigation.top
    - navigation.footer
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          rendering:
            show_source: true

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
      - First Run: getting-started/first-run.md
  - User Guide:
      - Overview: user-guide/index.md
      - Project Structure: user-guide/project-structure.md
      - Modular Architecture: user-guide/modular-architecture.md
      - Core Services: user-guide/core-services.md
      - Feature Flags UI: user-guide/feature-flags-frontend.md
      - Configuration:
...
  - Community: community.md
  - API Reference: api/README.md
  - Architecture: structure/README.md


markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-org/fastapi-saas
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/fastapi/
  version:
    provider: mike
  analytics:
    provider: google
    property: !ENV [GOOGLE_ANALYTICS_KEY, ""]

extra_css:
  - stylesheets/extra.css

repo_name: your-org/fastapi-saas
repo_url: https://github.com/your-org/fastapi-saas
edit_uri: edit/main/docs/

